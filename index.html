/* ---------- Kursbuch (Netzwerk A1 chapters 1-12): overview, chapter pages, tests, mock exam ---------- */
const BK={mode:null,id:null,list:[],i:0,ok:0,ans:null,title:''};
function bkQs(c,withTF){
  const q=c.q.map(x=>({t:'mc',q:x[0],opts:ezShuffle(x[1].slice()),a:x[1][x[2]],ex:[x[3],x[4]],ch:c.n}));
  if(withTF)c.les[1].forEach(x=>q.push({t:'tf',ctx:c.les[0],q:x[0],opts:['Richtig','Falsch'],a:x[1]?'Richtig':'Falsch',ex:[x[2],x[3]],ch:c.n}));
  return q;
}
function bkBuild(mode,id){
  if(mode==='listen'||mode==='exam')return bkBuildMore(mode);
  if(mode==='ch'){const c=BOOK[id-1];return ezShuffle(bkQs(c,true));}
  if(mode==='test'){const a=(id-1)*3;let q=[];BOOK.slice(a,a+3).forEach(c=>{q=q.concat(bkQs(c,true));});return ezShuffle(q);}
  let q=[];BOOK.forEach(c=>{q=q.concat(bkQs(c,true));});return ezShuffle(q).slice(0,20);
}
function bkRender(){
  const box=$('#bkBox');if(!box)return;
  const lm=BK.mode==='listen',em=BK.mode==='exam';
  if(!BK.list.length){box.innerHTML=`<p class="en">${em?'Tap start when you are ready. The timer starts now.':lm?'10 listening questions.':BK.mode==='final'?'20 random questions from all 12 chapters. Pass mark: 60%.':'Mixed questions: grammar and reading, with explanations.'}</p><p class="bn">${em?'প্রস্তুত হলে শুরু চাপো। টাইমার তখনই চালু হবে।':lm?'১০টি শোনার প্রশ্ন।':BK.mode==='final'?'১২টি চ্যাপ্টার থেকে ২০টি এলোমেলো প্রশ্ন। পাস মার্ক: ৬০%।':'ব্যাকরণ ও পড়ার মিশ্র প্রশ্ন, ব্যাখ্যাসহ।'}</p><button type="button" class="btn primary" data-act="bkstart">${L('Start','শুরু করো')}</button>`;return;}
  const n=BK.list.length;
  if(BK.i>=n){
    const pct=Math.round(BK.ok*100/n),pass=pct>=60;
    if(BK.mode==='ch'){}else if(BK.mode==='listen'||BK.mode==='exam'){const best=store.get('bk:'+BK.mode,0);if(pct>best)store.set('bk:'+BK.mode,pct);}else{const best=store.get('bk:'+BK.mode+BK.id,0);if(pct>best)store.set('bk:'+BK.mode+BK.id,pct);}
    box.innerHTML=`<div style="font-size:24px;font-weight:700">${BK.ok} / ${n} · ${pct}% ${pass?'🏆':'💪'}</div><p>${pass?L('Bestanden! You passed.','পাস করেছ!'):L('Not yet 60%. Read the chapter again and retry.','এখনও ৬০% হয়নি। চ্যাপ্টার আবার পড়ে চেষ্টা করো।')}</p>${em?exResult():''}<div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="bkstart">${L('Again','আবার')}</button></div>`;return;
  }
  const q=BK.list[BK.i],done=BK.ans!==null;
  const kind=q.t==='tf'?L('Richtig oder falsch?','সত্য নাকি মিথ্যা?'):q.t==='ha'?L('What do you hear?','কী শুনছ?'):q.t==='ht'?L('Listen, then decide','শোনো, তারপর ঠিক করো'):L('Choose the answer','উত্তর বাছাই করো');
  const ctx=q.t==='tf'?`<div class="card" style="margin:8px 0">${say(esc(q.ctx),q.ctx)}</div>`:q.t==='ht'?`<div class="card" style="margin:8px 0">${sayBtn(q.ctx)} ${L('Play the text','লেখাটি শোনো')}${done?`<p>${esc(q.ctx)}</p>`:''}</div>`:q.t==='ha'?`<div class="card" style="margin:8px 0">${sayBtn(q.sent)} ${L('Play the sentence','বাক্যটি শোনো')}</div>`:'';
  box.innerHTML=`<div class="mute" style="font-size:13px">${BK.i+1} / ${n} · ${kind}${q.part?' · '+q.part:''}${q.t!=='ha'&&q.t!=='ht'||true?' · '+L('Chapter','চ্যাপ্টার')+' '+q.ch:''}</div>${ctx}
  <div style="font-size:20px;font-weight:700;margin:8px 0">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt ${done?(o===q.a?'right':(i===BK.ans?'wrong':'')):''}" data-act="bkpick" data-i="${i}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${done?`<div class="fb">${q.opts[BK.ans]===q.a?'✅ '+L('Richtig!','ঠিক!'):'❌ '+L('Correct:','সঠিক:')+' <b>'+esc(q.a)+'</b>'}<div class="en mute">${esc(q.ex[0])}</div><div class="bn mute">${esc(q.ex[1])}</div></div><div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="bknext">${BK.i+1>=n?L('Result','ফলাফল'):L('Next','পরের')}</button></div>`:''}`;
}
/* ---------- Training: Wiederholung (spaced repetition), Hörverstehen, Prüfungs-Simulator, streak ---------- */
function todayN(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);}
function streakBump(){const s=store.get('streak',{d:0,n:0}),t=todayN();if(s.d===t)return s;s.n=(s.d===t-1)?s.n+1:1;s.d=t;store.set('streak',s);return s;}
function streakNow(){const s=store.get('streak',{d:0,n:0});return (s.d===todayN()||s.d===todayN()-1)?s.n:0;}
const SRS_INT=[1,2,4,8,16,32];
function srsDeck(){const m={};BOOK.forEach(c=>c.v.forEach(v=>{m[v[0]]=v;}));TOPICS.forEach(t=>t.v.forEach(v=>{if(/^(der|die|das)\s/.test(v[0]))m[v[0]]=v;}));return m;}
function srsStats(){const deck=srsDeck(),s=store.get('srs',{}),t=todayN();let due=0,learned=0,seen=0;Object.keys(s).forEach(k=>{if(!deck[k])return;seen++;if(s[k][1]<=t)due++;if(s[k][0]>=3)learned++;});return {total:Object.keys(deck).length,seen,due,learned,fresh:Object.keys(deck).length-seen};}
const RV={q:[],i:0,ok:0,shown:false,n:0};
function rvBuild(){const deck=srsDeck(),s=store.get('srs',{}),t=todayN();
  const due=Object.keys(s).filter(k=>deck[k]&&s[k][1]<=t),fresh=ezShuffle(Object.keys(deck).filter(k=>!s[k]));
  return ezShuffle(due).slice(0,15).concat(fresh.slice(0,Math.max(5,15-Math.min(due.length,15))).slice(0,10)).map(k=>deck[k]);}
function rvRender(){const box=$('#rvBox');if(!box)return;
  if(!RV.q.length){box.innerHTML=`<p class="en">Each session shows words that are due plus a few new ones. Say if you knew the word. Known words come back later, forgotten words come back soon.</p><p class="bn">প্রতি সেশনে যে শব্দগুলোর সময় হয়েছে ও কিছু নতুন শব্দ আসে। জানলে “Gewusst”, না জানলে “Nochmal”। জানা শব্দ দেরিতে, ভুলে যাওয়া শব্দ তাড়াতাড়ি ফিরে আসে।</p><button type="button" class="btn primary" data-act="rvstart">${L('Start session','সেশন শুরু')}</button>`;return;}
  if(RV.i>=RV.q.length){box.innerHTML=`<div style="font-size:24px;font-weight:700">${RV.ok} / ${RV.n} 🎉</div><p>${L('Session done. Come back tomorrow for the next due words.','সেশন শেষ। পরের শব্দের জন্য কাল ফিরে এসো।')}</p><p>🔥 ${L('Streak','টানা দিন')}: ${streakNow()}</p><button type="button" class="btn primary" data-act="rvstart">${L('Another session','আরেকটি সেশন')}</button>`;return;}
  const v=RV.q[RV.i];
  box.innerHTML=`<div class="mute" style="font-size:13px">${RV.i+1} / ${RV.q.length}</div><div style="font-size:22px;font-weight:700;margin:10px 0"><span class="en">${esc(v[2])}</span> · <span class="bn">${esc(v[3])}</span></div>${RV.shown?`<div class="card" style="font-size:22px">${say(wordHtml(v[0],v[1]),v[0])} ${v[1]&&v[1]!=='-'&&v[1]!=='Pl.'?`<div class="mute" style="font-size:14px">Plural: ${esc(v[1])}</div>`:''}</div><div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="rvyes">✅ Gewusst</button><button type="button" class="btn" data-act="rvno">🔁 Nochmal</button></div>`:`<button type="button" class="btn primary" data-act="rvshow">${L('Show German word','জার্মান শব্দ দেখাও')}</button>`}`;}
function rvGrade(ok){const v=RV.q[RV.i],s=store.get('srs',{}),cur=s[v[0]]?s[v[0]][0]:-1,t=todayN();
  const b=ok?Math.min(cur+1,5):0;s[v[0]]=[b,ok?t+SRS_INT[b]:t];store.set('srs',s);streakBump();
  if(ok)RV.ok++;else if(RV.q.length<30)RV.q.push(v);
  RV.i++;RV.shown=false;rvRender();}
function showReview(){const st=srsStats();RV.q=[];RV.i=0;RV.ok=0;RV.shown=false;

function hearQs(c,nHa,nHt){const q=[];
  ezShuffle(c.p.slice()).slice(0,nHa).forEach(p=>{const d=ezShuffle(c.p.filter(x=>x!==p)).slice(0,2);q.push({t:'ha',sent:p[0],q:'',opts:ezShuffle([p[0]].concat(d.map(x=>x[0]))),a:p[0],ex:[p[1],p[2]],ch:c.n,part:'Hören'});});
  if(nHt)ezShuffle(c.les[1].slice()).slice(0,nHt).forEach(x=>q.push({t:'ht',ctx:c.les[0],q:x[0],opts:['Richtig','Falsch'],a:x[1]?'Richtig':'Falsch',ex:[x[2],x[3]],ch:c.n,part:'Hören'}));
  return q;}
function bkBuildMore(mode){
  if(mode==='listen'){let q=[];ezShuffle(BOOK.slice()).slice(0,6).forEach(c=>{q=q.concat(hearQs(c,1,1));});return ezShuffle(q).slice(0,10);}
  let h=[],l=[],g=[];
  ezShuffle(BOOK.slice()).slice(0,6).forEach(c=>{h=h.concat(hearQs(c,1,1)).slice(0);});h=ezShuffle(h).slice(0,6);
  ezShuffle(BOOK.slice()).slice(0,6).forEach(c=>{const r=ezShuffle(c.les[1].slice())[0];l.push({t:'tf',ctx:c.les[0],q:r[0],opts:['Richtig','Falsch'],a:r[1]?'Richtig':'Falsch',ex:[r[2],r[3]],ch:c.n,part:'Lesen'});});
  ezShuffle(BOOK.slice()).slice(0,8).forEach(c=>{const x=ezShuffle(c.q.slice())[0];g.push({t:'mc',q:x[0],opts:ezShuffle(x[1].slice()),a:x[1][x[2]],ex:[x[3],x[4]],ch:c.n,part:'Grammatik'});});
  return h.concat(l,g);}
function showListen(){BK.mode='listen';BK.id=0;BK.list=[];BK.i=0;BK.ok=0;BK.ans=null;

function showExam(){BK.mode='exam';BK.id=0;BK.list=[];BK.i=0;BK.ok=0;BK.ans=null;clearInterval(BK.tm);
  main().innerHTML=`<div class="pagehead"><div class="kicker">Extras</div><h1>🎓 Prüfungs-Simulator</h1><p class="en">A mock of the A1 exam: Hören (6) → Lesen (6) → Grammatik (8) → then Schreiben and Sprechen tasks with model answers. 40 minutes. Pass mark 60%.</p><p class="bn">A1 পরীক্ষার মক: শোনা (৬) → পড়া (৬) → ব্যাকরণ (৮) → তারপর লেখা ও বলার টাস্ক নমুনা উত্তরসহ। ৪০ মিনিট। পাস মার্ক ৬০%।</p></div><div class="card"><div id="exTimer" class="mute" style="font-weight:700"></div><div id="bkBox"></div></div>`;bkRender();}
function exStart(){BK.end=Date.now()+40*60e3;clearInterval(BK.tm);
  const tick=()=>{const e=$('#exTimer');if(!e||BK.mode!=='exam'){clearInterval(BK.tm);return;}const left=BK.end-Date.now();if(left<=0){clearInterval(BK.tm);BK.i=BK.list.length;bkRender();return;}e.textContent='⏱ '+Math.floor(left/6e4)+':'+String(Math.floor(left/1e3)%60).padStart(2,'0');};
  tick();BK.tm=setInterval(tick,1000);}
function exResult(){clearInterval(BK.tm);const e=$('#exTimer');if(e)e.textContent='';
  const parts={};BK.list.forEach((q,i)=>{const p=q.part||'';parts[p]=parts[p]||[0,0];parts[p][1]++;if(q.right)parts[p][0]++;});
  const c=ezShuffle(BOOK.slice())[0],c2=ezShuffle(BOOK.slice())[0];
  return `<div class="card" style="margin-top:12px"><h3>${L('Result by part','অংশ অনুযায়ী ফল')}</h3>${Object.keys(parts).map(p=>`<div>${p}: <b>${parts[p][0]} / ${parts[p][1]}</b></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>✍️ Schreiben</h3><div class="en">${esc(c.sch[0])}</div><div class="bn">${esc(c.sch[1])}</div><textarea class="win" rows="3" placeholder="Schreib hier …"></textarea><details><summary>${L('Show model answer','নমুনা উত্তর দেখো')}</summary><p>${say(esc(c.sch[2]),c.sch[2])}</p></details><h3 style="margin-top:14px">🗣️ Sprechen</h3><div class="en">${esc(c2.spr[0])}</div><div class="bn">${esc(c2.spr[1])}</div><details><summary>${L('Show model answer','নমুনা উত্তর দেখো')}</summary><p>${say(esc(c2.spr[2]),c2.spr[2])}</p></details></div>`;}

  else h+=`<option value="">— keine deutsche Stimme / জার্মান ভয়েস নেই —</option>`;

  sel.innerHTML=h;if(TTS.voice)sel.value=TTS.voice.voiceURI||TTS.voice.name;

const nrm=s=>asciiNum(s).toLowerCase().replace(/[.,!?;:"“”„‚‘’'()\[\]{}\/\\|…–—_*·।-]/g,' ').replace(/\s+/g,' ').trim();
const NOART=w=>String(w).replace(/^(der|die|das|ein|eine)\s+/i,'');
const NOPAR=w=>String(w).replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();

/* ---- course lexicon (built once from the lessons) ---- */
let LEX=null;
function buildLex(){
  if(LEX)return LEX;
  const X=LEX={ph:Object.create(null),wd:Object.create(null),wdN:Object.create(null),wdO:Object.create(null),m:{en:Object.create(null),bn:Object.create(null)},sent:[],seen:Object.create(null)};
  const putPh=(lang,txt,obj)=>{const k=nrm(txt);if(k&&!X.ph[lang+':'+k])X.ph[lang+':'+k]=obj;};
  const addSent=(de,en,bn)=>{
    if(!de||!en||/_{2}/.test(de))return;
    const o={de:de,en:en,bn:bn||''};
    putPh('de',de,o);putPh('en',en,o);if(bn)putPh('bn',bn,o);
    if(!X.seen[de]){X.seen[de]=1;X.sent.push(o);}
  };
  DAYS.forEach(d=>{
    (d.vocab||[]).forEach(v=>{
      const e={de:v[0],pl:v[1],en:v[2],bn:v[3],n:d.n};
      const clean=NOPAR(v[0]);
      putPh('de',clean,e);
      clean.split(/\s\/\s/).forEach(a=>{const b=NOART(a.trim());const k=nrm(b);if(k&&!X.wd[k])X.wd[k]=e;const mp=/^(der|die|das)\s/.test(v[0])?X.wdN:X.wdO;if(k&&!mp[k])mp[k]=e;putPh('de',b,e);});
      if(/^(der|die|das)\s/.test(v[0])){const par=/\(([^)]+)\)/.exec(v[0]);if(par){const k=nrm(par[1]);if(k&&k.indexOf(' ')<0&&!X.wd[k])X.wd[k]=e;}}
      putPh('en',v[2],e);putPh('bn',v[3],e);
      splitM(v[2]).forEach(m=>{(X.m.en[m]=X.m.en[m]||[]).push(e);});
      splitM(v[3]).forEach(m=>{(X.m.bn[m]=X.m.bn[m]||[]).push(e);});
    });
    (d.gram||[]).forEach(g=>(g.ex||[]).forEach(e=>addSent(e[0],e[1],e[2])));
    (d.dlg||[]).forEach(dl=>(dl.l||[]).forEach(l=>addSent(l[1],l[2],l[3])));
    (d.qa||[]).forEach(q=>{addSent(q[0],q[1],q[2]);addSent(q[3],q[4],q[5]);});
    (d.ex||[]).forEach(e=>{if(e.k==='tr')(e.q||[]).forEach(q=>addSent(q[2],q[0],q[1]));});
  });
  X.sent.forEach(s=>{s.t=nrm(s.de).split(' ');});
  return X;
}
/* noun (der/die/das …) and non-noun (verb, adjective …) can share one spelling: essen / das Essen – a capital letter or an article decides */
const entryFor=(t,strict)=>{
  const X=buildLex(),s=NOPAR(String(t||'').trim()),had=/^(der|die|das|ein|eine)\s/i.test(s),k=nrm(NOART(s));
  if(!k)return null;
  if(had)return X.wdN[k]||X.wd[k]||null;
  if(/^[A-ZÄÖÜ]/.test(s))return X.wdN[k]||X.wdO[k]||null;
  return X.wdO[k]||(strict?null:X.wdN[k])||null;
};

/* ---- word info: word class + article (course → Wiktionary → ending guess) ---- */
const WK=Object.create(null);
const WKCLS=[[/pronomen/i,'pron'],[/^(substantiv|eigenname|toponym|vorname|nachname)/i,'noun'],[/verb/i,'verb'],[/adjektiv|partizip/i,'adj'],[/adverb/i,'adv']];
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const low1=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
function wkClean(s){return String(s||'').replace(/<ref[^>]*>[\s\S]*?<\/ref>/g,'').replace(/<[^>]+>/g,'').replace(/\{\{[^}]*\}\}/g,'').replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/'{2,}/g,'').replace(/\s+/g,' ').trim();}
function parseWikt(wt){
  const m=/^==[^=\n]*\{\{Sprache\|Deutsch\}\}[^=\n]*==\s*$/m.exec(wt);if(!m)return null;
  let sec=wt.slice(m.index+m[0].length);const nx=/^==[^=]/m.exec(sec);if(nx)sec=sec.slice(0,nx.index);
  const w=/\{\{Wortart\|([^|}]+)\|Deutsch\}\}/.exec(sec);if(!w)return null;
  let cls='other';for(const p of WKCLS)if(p[0].test(w[1])){cls=p[1];break;}
  const o={cls:cls,wc:w[1],art:'',pl:'',examples:[]};
  if(cls==='noun'){
    const g=/\|Genus(?: 1)?\s*=\s*([mfn])/.exec(sec);if(g)o.art={m:'der',f:'die',n:'das'}[g[1]];
    const p=/\|Nominativ Plural(?: 1)?\s*=\s*([^\n|}]*)/.exec(sec);if(p){const v=wkClean(p[1]);if(v&&!/^[—–-]+$/.test(v))o.pl=v;}
  }
  const b=/\{\{Beispiele\}\}([\s\S]*?)(?=\n\{\{[A-Z]|\n=+|$)/.exec(sec);
  if(b)b[1].split('\n').forEach(l=>{const mm=/^:\[[^\]]*\]\s*(.+)$/.exec(l.trim());if(!mm)return;const t=wkClean(mm[1]),n=t.split(' ').length;if(n>=3&&n<=14&&/[.!?]$/.test(t)&&!/[\[\]{}|]/.test(t))o.examples.push(t);});
  o.examples.sort((a,b)=>a.length-b.length);o.examples=o.examples.slice(0,6);
  return o;
}
async function wikt(word){
  if(WK[word])return WK[word];
  if(navigator.onLine===false||!/^[A-Za-zÄÖÜäöüß-]+$/.test(word))return null;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
  try{
    for(const c of Array.from(new Set([cap1(word),word,word.toLowerCase()]))){
      try{
        const r=await fetch('https://de.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent(c)+'&prop=wikitext&format=json&redirects=1&origin=*',{signal:ctl.signal});
        if(!r.ok)continue;
        const j=await r.json(),wt=j&&j.parse&&j.parse.wikitext&&j.parse.wikitext['*'];
        const o=wt&&parseWikt(wt);
        if(o){WK[word]=o;return o;}
      }catch(e){if(ctl.signal.aborted)break;}
    }
  }finally{clearTimeout(tm);}
  return null;
}
async function deInfo(bare,entry){
  const info={de:bare,cls:'',art:'',pl:'',plOnly:false,uncount:false,src:'',entry:entry||null,wk:null};
  if(entry){
    const m=/^(der|die|das)\s+(.+)$/.exec(NOPAR(entry.de));
    if(m){
      info.cls='noun';info.art=m[1];info.de=m[2].split(/\s\/\s/)[0].trim();info.src='course';
      info.pl=(entry.pl&&['-','–','Pl.'].indexOf(entry.pl)<0)?entry.pl:'';
      info.plOnly=entry.pl==='Pl.';info.uncount=entry.pl==='-'||entry.pl==='–';
      return info;
    }
    info.de=NOPAR(entry.de).split(/\s\/\s/)[0].trim();
  }
  const wk=await wikt(info.de);
  if(wk){
    info.wk=wk;info.cls=wk.cls;info.src='wiktionary';
    if(wk.cls==='noun'){info.art=wk.art;info.pl=wk.pl;info.uncount=!wk.pl;info.de=cap1(info.de);}else info.de=low1(info.de);
    return info;
  }
  if(!entry&&isNounLike(info.de)){const g=guessArticle(info.de);if(g){info.cls='noun';info.art=g.art;info.src='guess';info.why=g.why;info.uncount=true;}}
  return info;
}
/* ---- example sentences: 1) real sentences of the lessons 2) safe model sentences 3) Wiktionary examples ---- */
function localSents(info){
  const X=buildLex(),base=info.de,forms=[nrm(base)];
  if(info.pl)forms.push(nrm(info.pl));
  const single=base.indexOf(' ')<0;
  const stem=(single&&(info.cls==='verb'||(!info.cls&&!info.art))&&/en$/.test(base)&&base.length>=5&&base.charAt(0)===base.charAt(0).toLowerCase())?nrm(base).slice(0,-2):'';
  const hit=[];
  X.sent.forEach(s=>{
    if(s.t.length<2)return;
    let ok=false;
    if(single){for(let i=0;i<s.t.length&&!ok;i++){const t=s.t[i];if(forms.indexOf(t)>=0)ok=true;else if(stem&&t.indexOf(stem)===0&&['e','st','t','en','et','te'].indexOf(t.slice(stem.length))>=0)ok=true;}}
    else ok=nrm(s.de).indexOf(forms[0])>=0;
    if(ok)hit.push(s);
  });
  hit.sort((a,b)=>a.de.length-b.de.length);
  return hit.map(s=>({de:s.de,en:s.en,bn:s.bn}));
}
function tmplSents(info){
  const w=info.de,out=[];
  const T=(de,en,bn)=>out.push({de:de,en:en||'',bn:bn||'',note:'tm'});
  if(info.cls==='noun'&&info.art){

    const e=info.entry,en1=e?firstM(e.en):'',bn1=e?firstM(e.bn):'',an=/^[aeiou]/i.test(en1)?'an':'a';
    if(info.plOnly){T(`Das sind die ${w}.`);T(`Wo sind die ${w}?`);T(`Ich sehe die ${w}.`);T(`Wir brauchen die ${w}.`);}
    else if(info.uncount){

      T(`Ich mag ${acc} ${w}.`,e&&`I like the ${en1}.`,e&&`আমার ${bn1} পছন্দ।`);
      T(`Ich nehme ${acc} ${w}.`,e&&`I'll take the ${en1}.`,e&&`আমি ${bn1} নেব।`);
    }else{
      T(`Das ist ${ind} ${w}.`,e&&`This is ${an} ${en1}.`,e&&`এটা একটি ${bn1}।`);
      T(`Wo ist ${a} ${w}?`,e&&`Where is the ${en1}?`,e&&`${bn1} কোথায়?`);
      T(`Ich brauche ${indAcc} ${w}.`,e&&`I need ${an} ${en1}.`,e&&`আমার একটা ${bn1} দরকার।`);
      if(info.pl)T(`Wir haben zwei ${info.pl}.`);else T(`Ich sehe ${acc} ${w}.`,e&&`I see the ${en1}.`,e&&`আমি ${bn1} দেখছি।`);
    }
  }else if(info.cls==='verb'){
    T(`Ich möchte ${w}.`);T(`Wir wollen ${w}.`);T(`Kannst du ${w}?`);T(`Du musst ${w}.`);
  }else if(info.cls==='adj'){
    T(`Das ist ${w}.`);T(`Es ist ${w}.`);T(`Ist das ${w}?`);T(`Das Buch ist ${w}.`);
  }
  return out;
}
async function examplesFor(info,max){
  const out=[],seen={};
  const add=s=>{if(s&&out.length<max&&!seen[s.de]){seen[s.de]=1;out.push(s);}};
  localSents(info).forEach(add);
  if(out.length<max&&!info.wk&&!info.cls&&!info.art){const wk=await wikt(info.de);if(wk){info.wk=wk;info.cls=wk.cls;if(wk.cls!=='noun')info.de=low1(info.de);}}
  if(out.length<max)tmplSents(info).forEach(add);
  if(out.length<max&&info.wk)info.wk.examples.forEach(t=>add({de:t,en:'',bn:'',note:'wk'}));
  return out;
}

const GA=[['das',/(chen|lein)$/i],['das',/(ment|um)$/i],['die',/(ung|heit|keit|schaft|ion|tät|ik|ur|ie|ei)$/i],['der',/(ling|ismus|ist|or|er)$/i]];
function guessArticle(w){for(const g of GA){const m=g[1].exec(w);if(m)return{art:g[0],why:'-'+m[1].toLowerCase()};}return null;}
const isNounLike=w=>/^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß]{2,}$/.test(w);

/* ---- word card (article · gender · plural · meanings · examples) ---- */
function plHtml(e){
  if(e.pl==='Pl.')return `<span class="cp">${L('only plural','শুধু বহুবচন')}</span>`;
  if(e.pl&&e.pl!=='-'&&e.pl!=='–')return `Plural: ${say(`<span class="cp">die</span> ${esc(e.pl)}`,'die '+e.pl)}`;
  return '';
}
const CLSN={noun:['noun','Nomen','বিশেষ্য'],verb:['verb','Verb','ক্রিয়া'],adj:['adjective','Adjektiv','বিশেষণ'],adv:['adverb','Adverb','ক্রিয়া-বিশেষণ'],pron:['pronoun','Pronomen','সর্বনাম'],other:['other word','Wort','শব্দ']};
function wordCard(e,o){
  o=o||{};
  const m=/^(der|die|das)\s/.exec(e.de),c=artClass(e.de,e.pl);
  let art='';
  if(m){art=`<div class="wc-art">${L('Article','আর্টিকেল')}: <span class="${c}">${m[1]}</span> <span class="mute">· ${e.pl==='Pl.'?L('plural','বহুবচন'):L(GEN[m[1]][0],GEN[m[1]][1])}</span></div>`;}
  const top=o.bare?'':`<div class="wc-top">${say(wordHtml(e.de,e.pl),e.de)}<span class="wpl">${plHtml(e)}</span></div>`;
  const mean=o.bare?'':`<div class="wc-m"><span><b>EN</b> ${esc(e.en)}</span><span class="bnf"><b>বাংলা</b> ${esc(e.bn)}</span>${e.n?`<a class="dpill" href="#day-${e.n}" data-close="1">Tag ${e.n}</a>`:''}</div>`;
  return `<div class="wcard ${c?'b-'+c:''}">${top}${o.bare&&plHtml(e)?`<div class="wc-art">${plHtml(e)}</div>`:''}${art}${mean}${exBox({entry:e},o.n||4)}</div>`;
}
/* card for any German word that is not in the course word list (article from Wiktionary, else a guess) */
function infoCard(info,o){
  o=o||{};
  const c=info.art?{der:'cm',die:'cf',das:'cn'}[info.art]:'',cn=CLSN[info.cls];
  const word=info.art?`<span class="${c}">${info.art}</span> ${say(esc(info.de),info.art+' '+info.de)}`:say(esc(info.de),info.de);
  let lines='';
  if(info.cls==='noun'&&info.art){
    const srcT=info.src==='course'?L('from the course ✓','কোর্স থেকে ✓'):(info.src==='wiktionary'?L('checked in Wiktionary ✓','Wiktionary থেকে ✓'):L('guess from the ending','শেষাংশ থেকে অনুমান'));
    lines+=`<div class="wc-art">${L('Article','আর্টিকেল')}: <span class="${c}">${info.art}</span> <span class="mute">· ${L(GEN[info.art][0],GEN[info.art][1])} · ${srcT}</span></div>`;
    if(info.src==='guess')lines+=`<div class="mute" style="font-size:13.5px">${L(`⚠ Not in the A1 course. By its ending (${info.why}) the article is probably “${info.art}” – only a guess, please check in a dictionary.`,`⚠ এটি A1 কোর্সে নেই। শেষাংশ (${info.why}) দেখে আর্টিকেল সম্ভবত “${info.art}” – শুধু অনুমান, অভিধানে মিলিয়ে নিও।`)}</div>`;
    if(info.pl)lines+=`<div class="wc-art">Plural: ${say(`<span class="cp">die</span> ${esc(info.pl)}`,'die '+info.pl)}</div>`;
  }else if(info.cls==='noun'){
    lines+=`<div class="wc-art">${L('Noun – the article could not be found.','বিশেষ্য – আর্টিকেল খুঁজে পাওয়া যায়নি।')}</div>`;
  }else if(cn){
    lines+=`<div class="wc-art">${L('Word type','শব্দের ধরন')}: ${cn[1]} <span class="mute">(${L(cn[0],cn[2])}) · ${L('only nouns have an article (der / die / das)','শুধু noun-এর আর্টিকেল (der / die / das) থাকে')}</span></div>`;
  }else{
    lines+=`<div class="mute" style="font-size:14px">${L('Word type could not be checked (no internet).','শব্দের ধরন দেখা গেল না (ইন্টারনেট নেই)।')}</div>`;
  }
  return `<div class="wcard ${c?'b-'+c:''}"><div class="wc-top">${word}</div>${lines}${exBox({info:info},o.n||4)}</div>`;
}
/* ---- online translation (only used when the course has no answer) ---- */
function decodeEnt(t){try{return new DOMParser().parseFromString(String(t),'text/html').documentElement.textContent||t;}catch(e){return t;}}
function chunkTxt(t,n){const res=[];let cur='';(t.match(/[^.!?।\n]+[.!?।\n]*/g)||[t]).forEach(s=>{if(cur&&(cur+s).length>n){res.push(cur);cur='';}if(s.length>n){for(let i=0;i<s.length;i+=n)res.push(s.slice(i,i+n));}else cur+=s;});if(cur.trim())res.push(cur);return res;}
async function netPiece(text,from,to,sig){
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text),{signal:sig});
    if(r.ok){const j=await r.json();const o=((j&&j[0])||[]).map(x=>(x&&x[0])||'').join('');if(o.trim())return{text:o,src:'Google Translate'};}
  }catch(e){if(sig&&sig.aborted)return null;}
  try{
    const out=[];
    for(const p of chunkTxt(text,450)){
      const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(p)+'&langpair='+from+'|'+to,{signal:sig});
      if(!r.ok)return null;
      const j=await r.json();const t=j&&j.responseData&&j.responseData.translatedText;
      if(!t||/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(t)||(j.responseStatus&&+j.responseStatus!==200))return null;
      out.push(decodeEnt(t));
    }
    return{text:out.join(' '),src:'MyMemory'};
  }catch(e){return null;}
}
async function netTr(text,from,to){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),Math.min(90000,12000+text.length*10));
  try{
    const res=[];let src='';
    for(const p of chunkTxt(text,1200)){const r=await netPiece(p,from,to,ctl.signal);if(!r)return null;res.push(r.text);src=r.src;}
    return{text:res.join(' '),src:src};
  }catch(e){return null;}finally{clearTimeout(tm);}
}
function localTr(text,from,to){
  const X=buildLex(),k=nrm(text);if(!k)return null;
  if(from==='de'&&k.indexOf(' ')<0||from==='de'&&/^(der|die|das)\s/i.test(String(text).trim())&&nrm(NOART(text)).indexOf(' ')<0){const e0=entryFor(text);if(e0&&e0[to])return{text:e0[to],entries:[e0]};}
  const e=X.ph[from+':'+k];
  if(e&&e[to])return{text:e[to],entries:e.pl!==undefined?[e]:[]};
  if(from!=='de'){
    const arr=X.m[from][k]||X.m[from][k.replace(/^(to|the|a|an)\s+/,'')];
    if(arr&&arr.length){const u=uniqE(arr);return{text:u[0][to],entries:u.slice(0,3)};}
  }
  return null;
}
async function trCore(text,from,to){
  const r={text:'',src:'',entries:[],info:null,err:''};
  const loc=localTr(text,from,to);
  if(loc){r.text=loc.text;r.src='course';r.entries=loc.entries;}
  else{
    if(navigator.onLine===false){r.err='offline';return r;}
    const n=await netTr(text,from,to);
    if(!n){r.err='net';return r;}
    r.text=n.text;r.src=n.src;
  }
  if(!r.entries.length){
    const e=from==='de'?entryFor(text):(to==='de'?entryFor(r.text,true):null);
    if(e&&nrm(text).split(' ').length<=3)r.entries=[e];
  }
  if(!r.entries.length){
    const gw=(from==='de'?text:(to==='de'?r.text:'')).trim(),bare=NOART(gw).trim();
    if(gw&&/^[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*$/.test(bare)&&gw.split(/\s+/).length<=(bare!==gw?2:1))r.info=await deInfo(bare,null);
  }
  return r;
}
/* German words of a longer text, with their article from the course */
function wordHelp(text,to){
  const X=buildLex(),seen={},out=[];
  nrm(text).split(' ').forEach(t=>{if(t.length<2||seen[t])return;seen[t]=1;const w=X.wd[t];if(w&&!out.some(o=>o===w))out.push(w);});
  return out.slice(0,14);
}

let DICT=null;

function dictList(){
  if(DICT)return DICT;
  const sk=w=>nrm(NOART(NOPAR(w))).replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
  DICT=allWords().map(x=>({k:sk(x.v[0]),e:{de:x.v[0],pl:x.v[1],en:x.v[2],bn:x.v[3],n:x.n}}));
  DICT.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);
  DICT.forEach(d=>{const l=(d.k[0]||'#').toUpperCase();d.l=/[A-Z]/.test(l)?l:'#';});
  return DICT;
}

function renderDict(){
  const D=dictList(),list=$('#dlist');if(!list)return;
  const nq=nrm(DQ.q);
  const keep=d=>{
    const e=d.e,m=/^(der|die|das)\s/.exec(e.de);
    if(DQ.a==='der'||DQ.a==='die'||DQ.a==='das'){if(!m||m[1]!==DQ.a||e.pl==='Pl.')return false;}
    else if(DQ.a==='pl'){if(e.pl!=='Pl.')return false;}
    else if(DQ.a==='other'){if(m)return false;}
    if(!nq)return true;
    return d.k.indexOf(nq)>=0||nrm(e.de).indexOf(nq)>=0||nrm(e.en).indexOf(nq)>=0||nrm(e.bn).indexOf(nq)>=0;
  };
  let h='',last='',cnt=0;const has={};
  D.forEach((d,i)=>{
    if(!keep(d))return;cnt++;has[d.l]=1;
    if(d.l!==last){last=d.l;h+=`<h3 class="dlet" id="dl-${d.l==='#'?'x':d.l}">${d.l}</h3>`;}
    const e=d.e,c=artClass(e.de,e.pl),pl=plHtml(e);
    h+=`<div class="drow ${c?'b-'+c:''}" data-i="${i}"><div class="dmain">${say(wordHtml(e.de,e.pl),e.de)}${pl?`<span class="dpl">${pl}</span>`:''}</div><div class="dmean">${DQ.dir!=='en'?`<span class="dm-b">${esc(e.bn)}</span>`:''}${DQ.dir!=='bn'?`<span class="dm-e">${esc(e.en)}</span>`:''}</div><button type="button" class="btn xs" data-act="dex" data-i="${i}">${L('Examples','উদাহরণ')}</button><div class="dxx" hidden></div></div>`;
  });
  list.innerHTML=h||`<div class="card dempty">${L('Nothing found.','কিছু পাওয়া যায়নি।')}</div>`;
  const all={};D.forEach(d=>{all[d.l]=1;});
  const lets='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(l=>all[l]);
  $('#dlets').innerHTML=lets.map(l=>`<button type="button" data-act="dlet" data-l="${l}" ${has[l]?'':'disabled'}>${l}</button>`).join('');
  $('#dcount').textContent=cnt+' / '+D.length;
}

  if(box.hidden){if(!box.innerHTML)box.innerHTML=wordCard(d.e,{bare:true,n:4});fillExBoxes(box);box.hidden=false;}else box.hidden=true;
}

  const bn=`<b>Tag ${d.n} – ${esc(d.de)}</b><br>${esc(d.bn)}<br><small>${wk[1]}${d.review?' · পরীক্ষার দিন':''} · ${bnNum(nm)}টি শব্দ · ${bnNum(nd)}টি সংলাপ · ${bnNum(ne)}টি অনুশীলন-সেট</small>${goals.length?`<ul>${goals.map(g=>`<li>${esc(g[1])}</li>`).join('')}</ul>`:''}${gh.length?`ব্যাকরণ: ${gh.map(esc).join(' · ')}<br>`:''}${lnk('#day-'+d.n,'দিন '+bnNum(d.n)+' খোলো →')}`;
  return A(lang,en,bn);
}
function weekAns(w,lang){
  const W=weeks().find(x=>x.w===w);if(!W)return null;
  const li=(k)=>W.days.map(d=>`<li>${lnk('#day-'+d.n,'Tag '+d.n)} – ${esc(k==='bn'?d.bn:d.en)}${d.review?' ✔':''}</li>`).join('');
  return A(lang,`<b>${W.w>=5?'Exam week':'Week '+W.w}</b> – ${WKT[w][0]}<ul>${li('en')}</ul>`,`<b>${W.w>=5?'পরীক্ষার সপ্তাহ':'সপ্তাহ '+bnNum(W.w)}</b> – ${WKT[w][1]}<ul>${li('bn')}</ul>`);
}
function vocabFind(q){
  const X=buildLex(),toks=nrm(q).split(' ').filter(t=>t.length>=2&&!STOP.has(t)),hits=[],seen={};
  const add=e=>{if(!seen[e.de]){seen[e.de]=1;hits.push(e);}};
  toks.forEach(t=>{
    if(X.wd[t])add(X.wd[t]);
    (X.m.en[t]||[]).forEach(add);(X.m.bn[t]||[]).forEach(add);
    if(BN_RE.test(t)&&t.length>=4){for(let i=t.length-1;i>=3;i--){const a=X.m.bn[t.slice(0,i)];if(a){a.forEach(add);break;}}}
  });
  return hits.slice(0,4);
}
function topicFind(q){
  const toks=nrm(q).split(' ').filter(t=>t.length>=3&&!STOP.has(t));if(!toks.length)return[];
  return DAYS.map(d=>{
    const hay=nrm([d.s,d.de,d.en,d.bn].concat((d.goals||[]).map(g=>g.join(' '))).concat((d.gram||[]).map(g=>g.h)).join(' '));
    let s=0;toks.forEach(t=>{if(hay.indexOf(t)>=0||(BN_RE.test(t)&&t.length>=5&&hay.indexOf(t.slice(0,t.length-2))>=0))s++;});
    return{d:d,s:s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.d.n-b.d.n).slice(0,4).map(x=>x.d);
}
const LW={de:/^(german|deutsch|জার্মান|jarman)/i,en:/^(english|englisch|ইংরেজি|ইংলিশ)/i,bn:/^(bangla|bengali|bengla|বাংলা)/i};
const lwOf=s=>{s=String(s||'').trim();return LW.de.test(s)?'de':LW.en.test(s)?'en':LW.bn.test(s)?'bn':'';};
function parseTr(q){
  let m=/^\s*(?:translate|übersetze|übersetzen|\/tr|tr:|অনুবাদ(?:\s+করো|\s+কর)?)\s*[:\-]?\s*["“]?(.+?)["”]?\s+(?:to|into|in|ins|nach|auf)\s+(german|deutsch|english|englisch|bangla|bengali|বাংলা|জার্মান|ইংরেজি)\s*$/i.exec(q);
  if(m)return{text:m[1],to:lwOf(m[2])};
  m=/^\s*(?:how (?:do (?:i|you) )?say|what(?:'s| is| does)?)\s+["“']?(.+?)["”']?\s+in\s+(german|deutsch|english|bangla|bengali)\s*\??\s*$/i.exec(q);
  if(m)return{text:m[1],to:lwOf(m[2])};
  m=/^\s*["“]?(.+?)["”]?\s*(?:কে|টা|টি|এর)?\s*(জার্মান|ইংরেজি|বাংলা)(?:তে|য়|ায়|ে)?\s*(?:অনুবাদ|বলো|বল|লেখো|কী হবে|কি হবে|বলে)/.exec(q);
  if(m)return{text:m[1],to:lwOf(m[2])};
  return null;
}
function guessLang(t,to){
  if(BN_RE.test(t))return'bn';

}

function detectLangLocal(t){
  t=String(t||'');
  if(BN_RE.test(t))return{l:'bn',sure:true};
  const w=t.toLowerCase().match(/[a-zäöüß]+/g)||[];
  let de=/[äöüß]/i.test(t)?2:0,en=0;
  w.forEach(x=>{if(DE_W.has(x))de++;if(EN_W.has(x))en++;});
  if(de>en)return{l:'de',sure:de>=2||w.length<=2};
  if(en>de)return{l:'en',sure:en>=2||w.length<=2};
  if(w.length===1){
    const X=buildLex(),k=nrm(t);
    if(X.m.en[k]||X.m.en[k.replace(/^(to|the|a|an)\s+/,'')])return{l:'en',sure:true};
    if(X.wd[k]||entryFor(t))return{l:'de',sure:true};
  }
  return{l:'en',sure:false};
}
const detectLang=t=>detectLangLocal(t).l;
async function netDetect(text){
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=bn&dt=t&q='+encodeURIComponent(String(text).slice(0,300)));
    if(!r.ok)return'';const j=await r.json();const c=String((j&&j[2])||'').toLowerCase().slice(0,2);
    return c==='de'||c==='en'||c==='bn'?c:'';
  }catch(e){return'';}
}
async function detectLangFull(t){
  const d=detectLangLocal(t);

  return (await netDetect(t))||d.l;
}
const trBlock=(lg,text,withSay)=>`<div class="tb"><div class="wc-h">${TLN[lg][0]}${lg==='de'?'':' · '+TLN[lg][1]}</div><div class="ocrtxt" lang="${lg}">${esc(text)}</div><div class="trbtns">${withSay?sayBtn(text.slice(0,2500)):''}<button type="button" class="btn xs" data-act="trcopy" data-t="${esc(text)}">${L('Copy','কপি')}</button></div></div>`;
async function trAll(text,lang,from){

  const rs=await Promise.all(to.map(t=>trCore(text,from,t)));

    const off=rs.some(r=>r.err==='offline');
    return{h:A(lang,off?'You are offline. Only words and sentences from the course can be translated without internet.':'The online translator could not be reached right now. Please try again in a moment.',off?'তুমি অফলাইনে। ইন্টারনেট ছাড়া শুধু কোর্সের শব্দ ও বাক্য অনুবাদ হয়।':'অনলাইন অনুবাদক এখন পাওয়া যাচ্ছে না। একটু পরে আবার চেষ্টা করো।'),c:[3]};
  }

  h+=`<br><small>${lnk('#translate','Open full translator →')}</small>`;
  return{h:h,c:[3,4]};

function mdLite(src){
  const out=[];let list=false;
  String(src).replace(/\r/g,'').split('\n').forEach(raw=>{
    const m=/^\s*[-*•]\s+(.*)$/.exec(raw);
    const body=m?m[1]:raw;
    let h=esc(body).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(?!\s)(.+?)\*/g,'<i>$1</i>');
    const g=/^\W*(?:Deutsch|German)\W*:\s*(.+)$/i.exec(body);
    if(g)h+=' '+sayBtn(g[1].replace(/[*_]/g,'').trim().slice(0,2500));
    if(m){if(!list){out.push('<ul>');list=true;}out.push('<li>'+h+'</li>');}
    else{if(list){out.push('</ul>');list=false;}if(body.trim())out.push('<p>'+h+'</p>');}
  });
  if(list)out.push('</ul>');
  return '<div class="aimd">'+out.join('')+'</div>';
}

async function prepImage(file){

  const sc=Math.min(1,2200/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data,hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=((p[i]*299+p[i+1]*587+p[i+2]*114)/1000)|0;p[i]=p[i+1]=p[i+2]=g;hist[g]++;}
  const tot=w*h;let lo=0,hi=255,a=0;
  while(lo<254&&(a+=hist[lo])<tot*0.02)lo++;
  a=0;while(hi>1&&(a+=hist[hi])<tot*0.02)hi--;
  if(hi-lo>20){const k=255/(hi-lo);for(let i=0;i<p.length;i+=4){let v=(p[i]-lo)*k;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v;}}
  x.putImageData(d,0,0);
  const tc=document.createElement('canvas'),ts=Math.min(1,150/Math.max(w,h));tc.width=Math.round(w*ts)||1;tc.height=Math.round(h*ts)||1;
  tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
  return{canvas:c,thumb:tc.toDataURL('image/jpeg',0.7)};
}
function cleanOcr(t){return String(t||'').replace(/\r/g,'').replace(/-\n(?=[a-zäöüß])/g,'').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\u0001').replace(/\n/g,' ').replace(/\u0001/g,'\n\n').replace(/ *\n */g,'\n').trim();}
async function ocrOne(file,bub,i,total){
  const set=h=>{bub.innerHTML=h;fillExBoxes(bub);chScroll();};
  const tag=total>1?`${L('Photo','ছবি')} ${i}/${total} · `:'';
  let prep=null;
  try{
    set(wait(tag+L('Preparing photo …','ছবি প্রস্তুত হচ্ছে …')));
    try{prep=await prepImage(file);}catch(e){set(`⚠ ${L('This picture could not be opened. Please use a JPG or PNG photo.','ছবিটি খোলা গেল না। অনুগ্রহ করে JPG বা PNG ছবি দাও।')}`);return;}
    if(aiOn()){
      try{
        set(wait(tag+L('AI is reading and translating the photo …','AI ছবি পড়ছে ও অনুবাদ করছে …')));
        const b=jpegB64(prep.canvas);
        const txt=await aiAsk([{role:'user',text:'PHOTO of a German book page. Transcribe the German text exactly, then translate it into Bangla and English.'}],[{mime:'image/jpeg',data:b}]);
        set(`<img class="ocrth" alt="" src="${prep.thumb}">`+aiBadge()+mdLite(txt));
        return;
      }catch(e){set(wait(tag+L('AI is busy – using the offline reader …','AI ব্যস্ত – অফলাইন রিডার ব্যবহার হচ্ছে …')));}
    }
    set(wait(tag+(OCR.worker?L('Reading text …','লেখা পড়া হচ্ছে …'):L('Loading the text reader (first time only, about 15 MB) …','টেক্সট রিডার লোড হচ্ছে (শুধু প্রথমবার, প্রায় ১৫ MB) …'))));
    let w;
    try{w=await ocrWorker();}catch(e){set(`⚠ ${L('The text reader could not be loaded. Please check your internet connection and try again.','টেক্সট রিডার লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করো।')}`);return;}
    OCR.cb=m=>{if(m.status==='recognizing text')set(wait(tag+L('Reading text … ','লেখা পড়া হচ্ছে … ')+Math.round((m.progress||0)*100)+' %'));};
    let res;
    try{res=await w.recognize(prep.canvas);}finally{OCR.cb=null;}
    const thumb=prep.thumb;prep.canvas.width=prep.canvas.height=1;
    const de=cleanOcr(res.data&&res.data.text);
    const img=`<img class="ocrth" alt="" src="${thumb}">`;
    if(de.replace(/\s/g,'').length<3){set(`${img}<div>⚠ ${L('I could not find any text in this picture. Try again with more light, hold the page straight and come closer.','এই ছবিতে কোনো লেখা পাইনি। আরও আলোয়, পাতা সোজা করে এবং কাছ থেকে আবার তোলো।')}</div>`);return;}
    set(img+wait(tag+L('Translating …','অনুবাদ হচ্ছে …')));
    const r=await trCore(de,'de','bn');
    const low=res.data&&res.data.confidence<55;
    let h=`${img}<small>${tag}Deutsch → বাংলা${r.src&&r.src!=='course'&&!r.err?' · '+esc(r.src):''}</small>`;
    h+=`<div class="wc-h">Deutsch (${L('recognised','চেনা লেখা')})</div><div class="ocrtxt" lang="de">${esc(de)}</div><div class="trbtns">${sayBtn(de.slice(0,2500))}<button type="button" class="btn xs" data-act="trcopy" data-t="${esc(de)}">${L('Copy','কপি')}</button><button type="button" class="btn xs" data-act="ocrtotr" data-t="${esc(de)}">${IC.tr} ${L('Edit in translator','অনুবাদকে নাও')}</button></div>`;
    if(r.err)h+=`<div class="trerr" style="margin-top:10px">${r.err==='offline'?L('You are offline – the translation needs internet.','তুমি অফলাইনে – অনুবাদের জন্য ইন্টারনেট লাগবে।'):L('The online translator could not be reached. Please try again.','অনলাইন অনুবাদক পাওয়া যায়নি। আবার চেষ্টা করো।')}</div>`;
    else{
      h+=`<div class="wc-h">বাংলা</div><div class="ocrtxt" lang="bn">${esc(r.text)}</div><div class="trbtns"><button type="button" class="btn xs" data-act="trcopy" data-t="${esc(r.text)}">${L('Copy','কপি')}</button><button type="button" class="btn xs" data-act="ocren" data-t="${esc(de)}">English</button></div><div class="ocren"></div>`;
      h+=r.entries.slice(0,1).map(e=>wordCard(e,{n:3})).join('');
      if(r.info)h+=infoCard(r.info,{n:3});
    }
    if(!r.entries.length){const hp=wordHelp(de);if(hp.length)h+=`<div class="trhelp"><div class="wc-h">${L('Words with article','আর্টিকেলসহ শব্দ')}</div>${hp.map(x=>`<span class="chipw">${say(wordHtml(x.de,x.pl),x.de)} <span class="en">${esc(x.en)}</span><span class="bn">${esc(x.bn)}</span></span>`).join('')}</div>`;}
    if(low)h+=`<small class="mute">${L('The text may contain reading errors (blurry or dark photo). Use “Edit in translator” to correct it.','লেখায় ভুল থাকতে পারে (ছবি ঝাপসা বা অন্ধকার)। ঠিক করতে “অনুবাদকে নাও” ব্যবহার করো।')}</small>`;
    set(h);
  }catch(e){set(`⚠ ${L('Something went wrong with this picture.','এই ছবিটিতে কিছু সমস্যা হয়েছে।')}`);}
  finally{if(prep&&prep.canvas){prep.canvas.width=prep.canvas.height=1;}}
}
function chatImages(files){
  files=Array.from(files||[]).filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|bmp|gif|avif)$/i.test(f.name));
  if(!files.length){toast(L('Please choose a picture (JPG or PNG).','একটি ছবি বেছে নাও (JPG বা PNG)।'),2800);return;}
  if(!CH.open)toggleChat(true);
  chatAdd('me',`📷 ${files.length} ${files.length===1?L('photo','ছবি'):L('photos','ছবি')}`);
  files.forEach((f,i)=>{
    const bub=chatAdd('bot',wait(L('Waiting …','অপেক্ষা …')));
    OCR.q=OCR.q.then(()=>ocrOne(f,bub,i+1,files.length));
  });
}
/* camera on computers (phones use the camera app through the file input) */
async function camOpen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#chCamIn').click();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    CH.stream=st;const v=$('#chVid');v.srcObject=st;$('#chCam').hidden=false;
  }catch(e){toast(L('Camera not available – choose a photo instead.','ক্যামেরা পাওয়া যায়নি – এর বদলে ছবি বেছে নাও।'),3000);$('#chFile').click();}
}
function camClose(){if(CH.stream){CH.stream.getTracks().forEach(t=>t.stop());CH.stream=null;}const v=$('#chVid');if(v)v.srcObject=null;const c=$('#chCam');if(c)c.hidden=true;}
function camSnap(){
  const v=$('#chVid');if(!v||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{if(b){chatImages([new File([b],'camera.jpg',{type:'image/jpeg'})]);toast('✓ '+L('Photo added','ছবি যোগ হয়েছে'),1200);}},'image/jpeg',0.92);
}
/* voice input */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const VL=[['bn-BD','বাংলা'],['en-US','English'],['de-DE','Deutsch']];
CH.vl=store.get('vlang','bn-BD');
const chPh=()=>{const i=$('#chIn');if(i)i.placeholder=CH.mode==='tr'?'Text → Übersetzung · লেখা দাও, অনুবাদ পাবে …':'Frage / Text … Ask / paste text … প্রশ্ন / লেখা …';};
function vlLabel(){const v=VL.find(x=>x[0]===CH.vl)||VL[0];const b=$('#chVl');if(b)b.textContent='🎙 '+v[1];}
function vlNext(){const i=VL.findIndex(x=>x[0]===CH.vl);CH.vl=VL[(i+1)%VL.length][0];store.set('vlang',CH.vl);vlLabel();}
function micToggle(){
  if(!SRC){toast(L('Voice input does not work in this browser – please use Chrome or Safari.','এই ব্রাউজারে ভয়েস ইনপুট চলে না – Chrome বা Safari ব্যবহার করো।'),3600);return;}
  if(CH.rec){try{CH.rec.stop();}catch(e){}return;}
  TTS.stop();
  const r=new SRC(),inp=$('#chIn'),mic=$('#chMic');CH.rec=r;
  r.lang=CH.vl;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=()=>{mic.classList.add('on');inp.placeholder=L('Listening … speak now','শুনছি … এখন বলো').replace(/<[^>]+>/g,'');};
  r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;inp.value=s;};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast(L('Microphone is blocked – please allow it in your browser.','মাইক্রোফোন বন্ধ – ব্রাউজারে অনুমতি দাও।'),3600);else if(e.error==='no-speech')toast(L('I did not hear anything.','কিছু শুনতে পাইনি।'),1800);else if(e.error==='network')toast(L('Voice input needs internet.','ভয়েস ইনপুটের জন্য ইন্টারনেট লাগে।'),2600);};
  r.onend=()=>{CH.rec=null;mic.classList.remove('on');chPh();const v=inp.value.trim();if(v){inp.value='';chatSend(v);}};
  try{r.start();}catch(e){CH.rec=null;}
}
document.addEventListener('submit',e=>{if(e.target.id==='chForm'){e.preventDefault();const i=$('#chIn');const v=i.value;i.value='';chatSend(v);}});
document.addEventListener('click',e=>{
  const u=e.target.closest('#chUml button');
  if(u){const i=$('#chIn'),s=i.selectionStart==null?i.value.length:i.selectionStart,en=i.selectionEnd==null?s:i.selectionEnd;i.value=i.value.slice(0,s)+u.textContent+i.value.slice(en);i.focus();try{i.setSelectionRange(s+1,s+1);}catch(x){}return;}
  const a=e.target.closest('#chat a[data-close]');
  if(a&&window.innerWidth<=700)toggleChat(false);
});
['pointerdown','mousedown'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('#chUml'))e.preventDefault();}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&CH.open&&$('#modal').hidden)toggleChat(false);
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='trIn'){e.preventDefault();trGo();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='trFrom')trSet(e.target.value,TR.to===e.target.value?TR.from:TR.to);
  else if(e.target.id==='trTo')trSet(TR.from===e.target.value?TR.to:TR.from,e.target.value);
});
document.addEventListener('input',e=>{
  if(e.target.id==='dq'){DQ.q=e.target.value;renderDict();}
});

document.addEventListener('change',e=>{
  if(e.target.id==='chFile'||e.target.id==='chCamIn'){const f=e.target.files;chatImages(f);e.target.value='';}
});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#chat'))e.preventDefault();});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#chat')&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();chatImages(e.dataTransfer.files);}});
document.addEventListener('paste',e=>{
  if(!CH.open||!e.clipboardData||!e.clipboardData.files||!e.clipboardData.files.length)return;
  const f=Array.from(e.clipboardData.files).filter(x=>/^image\//.test(x.type));
  if(f.length){e.preventDefault();chatImages(f);}
});

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  TTS.stop();if(!$('#modal').hidden)closeModal();
  document.body.classList.remove('menu');
  let m,r='home';
  if((m=/^day-(\d+)$/.exec(h))){r=h;showDay(+m[1]);}
  else if(h==='words'){r=h;showWords();}
  else if(h==='secrets'){r=h;showSecrets();}
  else if(h==='easy'){r=h;showEasy();}
  else if(h==='topics'){r=h;showTopics();}
  else if(h==='review'){r=h;showReview();}
  else if(h==='listen'){r=h;showListen();}
  else if(h==='exam'){r=h;showExam();}
  else if(h==='book'){r=h;showBook();}
  else if((m=/^book-(\d+)$/.exec(h))){r='book';showBookChapter(+m[1]);}
  else if((m=/^booktest-([1-4])$/.exec(h))){r='book';showBookTest('test',+m[1]);}
  else if(h==='bookfinal'){r='book';showBookTest('final',0);}
  else if((m=/^topic-([a-z]+)$/.exec(h))){r='topics';showTopic(m[1]);}
  else if(h==='plan'){r=h;showPlan();}
  else if(h==='translate'){r=h;showTranslate();}
  else if(h==='dictionary'){r=h;showDictionary();}
  else showHome();
  renderNav(r);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
setLang(store.get('lang','both'));
TTS.init();
route();
// Chrome: speech can stay paused after the tab was in the background
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TTS.ok){try{speechSynthesis.resume();}catch(e){}}});
})();
