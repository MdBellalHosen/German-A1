<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch A1 – জার্মান শিখি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fff;--ink:#1c1a17;--mute:#6f685c;--line:#e6dfd0;--soft:#faf7f0;--hl:#fff0b8;
--red:#d7263d;--gold:#f6b21b;--blk:#1c1a17;--m:#1d64d8;--f:#d7263d;--n:#138a52;--p:#e06c00;
--ok:#138a52;--okbg:#e5f5ec;--bad:#c8243a;--badbg:#fde8eb;--alm:#a86d00;--almbg:#fff4d6;
--r:16px;--sh:0 1px 2px rgba(40,30,10,.05),0 6px 20px rgba(40,30,10,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif}
body.noscroll{overflow:hidden}
.bn{font-family:"Hind Siliguri",Inter,sans-serif}
body.l-en .bn{display:none!important}
body.l-bn .en{display:none!important}
body.l-both p.bn,body.l-both div.bn.tr,body.l-both .tr.bn{color:#7a6644}
body.l-both .lbl .bn::before{content:" · ";color:var(--mute)}
a{color:var(--m)}
button{font-family:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.flag{display:flex;height:4px}.flag i{flex:1}.flag i:nth-child(1){background:var(--blk)}.flag i:nth-child(2){background:var(--red)}.flag i:nth-child(3){background:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:0 16px;max-width:1280px;margin:0 auto;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:var(--blk);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px;position:relative;overflow:hidden;padding-bottom:3px}
.logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--red) 50%,var(--gold) 50%)}
.brand b{display:block;font-size:16px;line-height:1.15;white-space:nowrap}.brand small{color:var(--mute);font-size:12.5px;white-space:nowrap}
.seg{display:inline-flex;background:#f0ebe0;border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.only-m{display:none!important}
/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1280px;margin:0 auto;gap:30px;padding:0 20px}
#side{position:sticky;top:63px;align-self:start;max-height:calc(100vh - 63px);overflow:auto;padding:18px 2px 30px}
.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;color:inherit;text-decoration:none;font-weight:600;font-size:15px;margin-bottom:2px}
.nl:hover{background:#ece6d8}.nl.on{background:#fff;box-shadow:var(--sh)}
.nl svg{width:20px;height:20px;flex:none}
.nl .ib{width:30px;height:30px;flex:none;border-radius:9px;background:#ece6d8;display:grid;place-items:center}
.ngroup{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;margin:18px 10px 6px}
.dn{width:30px;height:30px;flex:none;border-radius:9px;background:#ece6d8;display:grid;place-items:center;font-size:13px;font-weight:800}
.dn.ok{background:var(--ok);color:#fff}
.nt{display:flex;flex-direction:column;line-height:1.25;min-width:0}.nt small{font-weight:500;color:var(--mute);font-size:12px}
main{padding:22px 0 140px;min-width:0}
#scrim{display:none}
@media(max-width:900px){
 .layout{grid-template-columns:1fr;padding:0 14px}
 .only-m{display:grid!important}
 #side{position:fixed;top:0;left:0;bottom:0;width:290px;max-height:none;background:var(--bg);z-index:70;padding:16px 12px 40px;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu #side{transform:none}
 body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(20,16,10,.4);z-index:65}
 .brand small{display:none}
}
@media(max-width:560px){.seg button{padding:6px 8px;font-size:12px}.brand b{font-size:15px}.bar{gap:7px;padding:0 10px}.logo{display:none}}
/* text */
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,4.4vw,42px);line-height:1.12;margin:.25em 0 .35em;letter-spacing:-.01em}
h3{font-size:18px;margin:0 0 8px;line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);margin:0 0 16px}
.card p{margin:0 0 8px}
@media(max-width:560px){.card{padding:16px 15px}}
.sec{scroll-margin-top:120px;margin-top:38px}
.sech{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 0 14px}
.sech h2{font-family:Fraunces,Georgia,serif;font-size:28px;margin:0;line-height:1.15}
.sech .sub2{color:var(--mute);font-size:14px;font-weight:600}
.mute{color:var(--mute)}
.small{font-size:13px}
/* speakable */
.say{cursor:pointer;border-bottom:1.5px dashed rgba(29,100,216,.35);border-radius:3px;transition:background .15s;-webkit-tap-highlight-color:transparent;outline:none}
.say:hover,.say:focus-visible{background:var(--hl)}
.say .ico{width:.88em;height:.88em;margin-left:.3em;vertical-align:-.08em;color:var(--m);opacity:.8}
.speaking{background:var(--hl)!important;box-shadow:0 0 0 3px var(--hl)}
.spk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:var(--m);vertical-align:middle;flex:none;padding:0}
.spk svg{width:17px;height:17px}
.spk.speaking{background:var(--m)!important;color:#fff;box-shadow:none}
.cm{color:var(--m);font-weight:700}.cf{color:var(--f);font-weight:700}.cn{color:var(--n);font-weight:700}.cp{color:var(--p);font-weight:700}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;padding:9px 15px;border-radius:12px;cursor:pointer;text-decoration:none;line-height:1.25}
.btn:hover{border-color:#cbbfa6}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--blk);color:#fff;border-color:var(--blk)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--blk)}
.btn.xs{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--bad);border-color:#f0c4cb}
.btn.done{background:var(--ok);color:#fff;border-color:var(--ok)}
/* day head */
.dayhead{background:var(--blk);color:#fff;border-radius:22px;padding:28px 28px 24px;position:relative;overflow:hidden}
.dayhead::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--gold),transparent 68%);opacity:.32;pointer-events:none}
.dayhead .kicker{color:var(--gold)}
.dayhead .sub{margin:2px 0;color:#e9e4d8}
.dayhead p.bn{color:#dccfae!important}
.dayhead .say{border-color:rgba(255,255,255,.35)}.dayhead .say:hover{background:rgba(255,255,255,.1)}
.dayhead .say .ico{color:var(--gold)}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:11.5px;letter-spacing:.06em;margin-left:6px}
.chips{position:sticky;top:63px;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:10px 0 0;background:linear-gradient(var(--bg) 78%,rgba(245,242,234,0));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--ink)}
/* goals */
.goals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.goals li{display:flex;gap:12px;align-items:flex-start}
.goals li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:2px}
.goals li span{display:block}
/* vocab */
.vtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.vlist{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.vrow{display:grid;grid-template-columns:minmax(170px,1.3fr) minmax(120px,.9fr) 1fr 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid #f0ebe0;align-items:center;border-left:4px solid transparent}
.vrow:last-child{border-bottom:0}
.vrow.h{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700;padding-top:8px;padding-bottom:8px}
body.l-en .vrow,body.l-bn .vrow{grid-template-columns:minmax(170px,1.3fr) minmax(120px,.9fr) 1.6fr}
.vrow.b-cm{border-left-color:var(--m)}.vrow.b-cf{border-left-color:var(--f)}.vrow.b-cn{border-left-color:var(--n)}.vrow.b-cp{border-left-color:var(--p)}
.vw{font-weight:600;font-size:16.5px}
.vp{font-size:15px}
.dpill{display:inline-block;font-size:11px;font-weight:700;background:#efe9dc;color:var(--mute);border-radius:6px;padding:0 6px;margin-left:6px;text-decoration:none;vertical-align:2px}
@media(max-width:700px){
 .vrow,body.l-en .vrow,body.l-bn .vrow{grid-template-columns:1fr auto;gap:0 10px;padding:10px 12px}
 .vrow.h{display:none}
 .vrow .vm{grid-column:1/-1;font-size:14.5px;color:var(--mute)}
 .vrow .vp{text-align:right;font-size:13.5px}
}
/* grammar */
.tbl{overflow-x:auto;margin:14px 0 6px;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--soft);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0ebe0;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#fcfbf7}
.tcap{font-weight:700;margin-top:18px;font-size:14px;color:var(--mute)}
.exs{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.exs li{background:var(--soft);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 10px 10px 0}
.exs .say{font-weight:600}
.tr{font-size:14.5px;color:var(--mute)}
/* dialog */
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dlghead h3{margin:0}
.line{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 10px;border-radius:12px;transition:background .2s}
.line.read{grid-template-columns:1fr}
.who{font-weight:700;font-size:13.5px;padding-top:3px}
.who.s0{color:var(--m)}.who.s1{color:var(--red)}.who.s2{color:var(--n)}
.line .say{font-size:16.5px;font-weight:500}
.line.speaking{box-shadow:none}
.dlg.playing .btn.play{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:600px){.line{grid-template-columns:1fr;gap:0}}
/* tips */
.tip{display:flex;gap:14px;background:#fffaf0;border-color:#f1dfae}
.tip .bulb{flex:none;width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:18px}
/* exercises */
.ex .exhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.exnum{flex:none;background:var(--blk);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:4px 9px;margin-top:2px;white-space:nowrap}
.ex h3{margin:0}.ex h3 span{display:block}.ex h3 .bn{font-weight:500;font-size:15.5px}
.exq{list-style:none;margin:0;padding:0;counter-reset:q}
.exq>li{counter-increment:q;position:relative;padding:12px 0 12px 36px;border-top:1px solid #f0ebe0}
.exq>li:first-child{border-top:0}
.exq>li::before{content:counter(q);position:absolute;left:0;top:13px;width:25px;height:25px;border-radius:50%;background:#efe9dc;font-size:12px;font-weight:800;display:grid;place-items:center}
.exq>li.is-ok::before{background:var(--ok);color:#fff;content:"✓"}
.exq>li.is-bad::before{background:var(--bad);color:#fff;content:"✗"}
.exq>li.is-almost::before{background:var(--alm);color:#fff;content:"✓"}
.exq>li.shown::before{background:#8a8170;color:#fff;content:"→"}
.qt{font-size:16px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid #cfc6b3;margin:0 2px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 14px;font-weight:500;font-size:15px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--m);color:var(--m)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.fin{font:inherit;font-weight:600;border:0;border-bottom:2px solid #cfc6b3;background:#fbf8f1;padding:2px 6px;border-radius:6px 6px 0 0;min-width:4ch;max-width:100%;color:var(--m);outline:none}
.fin:focus{border-color:var(--m);background:#eef4ff}
.is-ok .fin{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.is-bad .fin{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.is-almost .fin{border-color:var(--alm);color:var(--alm);background:var(--almbg)}
.tin,.win{display:block;width:100%;font:inherit;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:8px;background:#fdfcf8;outline:none;color:var(--ink)}
.tin:focus,.win:focus{border-color:var(--m);background:#fff}
.is-ok .tin{border-color:var(--ok);background:var(--okbg)}.is-bad .tin{border-color:var(--bad);background:var(--badbg)}
.win{min-height:120px;resize:vertical}
.fb{margin-top:7px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fb:empty{display:none}
.okc{color:var(--ok)}.badc{color:var(--bad)}.almc{color:var(--alm)}
.sol{font-weight:700;color:var(--ink)}
.exbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #f0ebe0}
.model{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.model .say{font-weight:600}
.prompt span{display:block}
.score{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px;flex-wrap:wrap}
.score .bar{flex:1;min-width:120px;height:9px;background:#efe9dc;border-radius:99px;overflow:hidden}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#3cc47c);width:0;transition:width .4s}
.score b{font-size:15px}
/* qa */
.qagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.qa{margin:0;display:flex;flex-direction:column;gap:8px}
.qa .qq .say{font-weight:600;font-size:16.5px}
.qa-a{padding:10px 12px;background:var(--okbg);border-radius:12px}
.qa-a .say{font-weight:600}
.qa .btn{align-self:flex-start}
/* homework */
.hw{background:linear-gradient(135deg,#1c1a17,#40331f);color:#fff;border:0}
.hw p.bn{color:#e6d7b5!important}
.hw .kicker{color:var(--gold);margin-bottom:6px}
.dayfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
/* home */
.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-bottom:28px}
.hero-main{background:var(--blk);color:#fff;border-radius:24px;padding:34px 32px;position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;right:-80px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--red),transparent 66%);opacity:.45;pointer-events:none}
.hero-main>*{position:relative;z-index:1}
.hero h1 span{color:var(--gold)}
.hero-main p{color:#e6e0d2;max-width:54ch;margin:0 0 6px}
.hero-main p.bn{color:#dccfae!important}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero-main .kicker{color:var(--gold)}
.hero-side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.hero-side h3{margin:0}
.bubbles{display:flex;flex-wrap:wrap;gap:8px}
.bubble{background:var(--soft);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 13px;font-weight:600;cursor:pointer}
.bubble:hover{background:var(--hl)}
.bubble.speaking{box-shadow:none}
.pbar{height:9px;background:#efe9dc;border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
.dcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.dcard:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(40,30,10,.1)}
.dcard .num{font-family:Fraunces,serif;font-size:36px;font-weight:700;line-height:1;color:#d6cbb3;display:flex;justify-content:space-between;align-items:flex-start}
.dcard.done .num{color:var(--ok)}
.dcard .num small{font-family:Inter,sans-serif;font-size:11px;font-weight:700;background:#efe9dc;color:var(--mute);border-radius:6px;padding:2px 7px}
.dcard.done .num small{background:var(--okbg);color:var(--ok)}
.dcard h3{margin:10px 0 4px;font-size:17px}
.dcard p{margin:0;font-size:14px;color:var(--mute)}
.dcard .best{margin-top:auto;padding-top:10px;font-size:12.5px;font-weight:600;color:var(--mute)}
.dcard.review{border-color:#f1c9cf}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.step{background:var(--soft);border-radius:14px;padding:14px}
.step b{display:block;font-size:22px;font-family:Fraunces,serif;color:var(--red)}
.step span{display:block;font-size:14px}
.astatus{font-size:13.5px;margin-top:4px}
.astatus .warn{color:#b85c00;font-weight:600}
.hero-main .astatus .warn{color:var(--gold)}
.astatus button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-main{padding:26px 22px}}
.pagehead{margin-bottom:18px}
.filters{display:grid;grid-template-columns:1fr 220px;gap:10px}
.filters .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.filters{grid-template-columns:1fr}}
select,input[type=search]{font:inherit;border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;width:100%;color:var(--ink)}
.seg.sm button{font-size:12.5px;padding:5px 10px}
/* secrets */
.rcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:12px}
.rcol{border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden}
.rcol h4{margin:0;padding:10px 14px;color:#fff;font-size:19px;font-family:Fraunces,serif}
.rc-m h4{background:var(--m)}.rc-f h4{background:var(--f)}.rc-n h4{background:var(--n)}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-top:1px solid #f0ebe0;font-size:15px;align-items:baseline}
.end{font-weight:800;font-size:14px;white-space:nowrap}
.rrow small{display:block;color:var(--mute);font-size:12.5px}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.blk{border:1.5px solid var(--line);border-radius:10px;padding:4px 11px;background:#fff;font-weight:600;text-align:center}
.blk small{display:block;font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.blk.v{background:var(--red);border-color:var(--red);color:#fff}.blk.v small{color:#ffd9de}
.srow{display:grid;grid-template-columns:minmax(150px,.8fr) 1.2fr;gap:6px 16px;padding:10px 0;border-top:1px solid #f0ebe0}
.srow:first-of-type{border-top:0}
@media(max-width:600px){.srow{grid-template-columns:1fr}}
.srow .k{font-weight:700}
.srow .k span,.srow .v span{display:block}
.prow{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid #f0ebe0;text-decoration:none;color:inherit}
.prow:last-child{border-bottom:0}
.prow:hover{background:#fcf8ee}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.prow .pt b{font-weight:600}
.prow .pt span{font-size:13.5px;color:var(--mute)}
.prow .pb{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.prow .pb small{font-size:12px;font-weight:600;color:var(--ok)}
.cert{background:linear-gradient(135deg,#fff7dc,#fff);border-color:#f1d27a;margin-bottom:20px}
.cert h2{font-family:Fraunces,serif;margin:4px 0 8px}
/* modal etc */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:14px}
.mbg{position:absolute;inset:0;background:rgba(20,16,10,.55)}
.mbox{position:relative;background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:calc(100vh - 28px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.mbox h2{font-family:Fraunces,serif;margin:0 40px 6px 0;font-size:25px;line-height:1.2}
.mclose{position:absolute;right:12px;top:12px;border:0;background:#f2ede2;width:34px;height:34px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1;color:var(--ink)}
.set{margin:16px 0}.set>label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.set.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--red)}
.help ol{padding-left:20px;margin:8px 0}.help li{margin-bottom:8px}
.help li span{display:block}
.fc-top{display:flex;justify-content:space-between;margin-bottom:12px;padding-right:44px;gap:10px}
.fc-card{min-height:230px;border-radius:18px;border:2px solid var(--line);border-top-width:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;background:var(--soft);user-select:none}
.fc-card.b-cm{border-top-color:var(--m)}.fc-card.b-cf{border-top-color:var(--f)}.fc-card.b-cn{border-top-color:var(--n)}.fc-card.b-cp{border-top-color:var(--p)}
.fc-w{font-size:30px;font-weight:700;font-family:Fraunces,serif;line-height:1.2}
.fc-pl{color:var(--mute);margin-top:6px}
.fc-hint{color:var(--mute);font-size:13px;margin-top:16px}
.fc-back{display:none;margin-top:14px;border-top:1px dashed #d8cfbb;padding-top:12px;width:100%}
.fc-card.flip .fc-back{display:block}.fc-card.flip .fc-hint{display:none}
.fc-m{font-size:19px;font-weight:600}
.fc-ctl{display:flex;justify-content:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mute)}
.stopfab{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--blk);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.stopfab[hidden]{display:none}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:100%;background:var(--gold);animation:eq .8s infinite ease-in-out;transform-origin:bottom}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--blk);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.uml{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:90;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.uml[hidden]{display:none}
.uml button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-weight:700;font-size:18px;cursor:pointer;color:var(--ink);padding:0}
/* ===== translator page ===== */
.trcard{padding:20px 22px}
.trpre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.trpre .btn.on{background:var(--blk);color:#fff;border-color:var(--blk)}
.trbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.trbar select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;color:var(--ink)}
#trIn{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;line-height:1.55;resize:vertical;min-height:120px;background:var(--soft);color:var(--ink)}
#trIn:focus{outline:2px solid var(--gold);background:#fff}
.trbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.trbtns .hint{font-size:12.5px;color:var(--mute);margin-left:auto}
.trres{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.trlbl{font-size:12.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.trtext{font-size:20px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.trtext[lang=bn]{font-family:"Hind Siliguri",Inter,sans-serif}
.trmeta{margin-top:8px;font-size:14px;color:var(--mute)}
.trhelp{margin-top:14px}
.trhelp .chipw{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:baseline;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin:0 6px 6px 0;font-size:14px}
.trerr{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--badbg);color:var(--bad);font-size:14.5px}
.trwait{margin-top:16px;color:var(--mute);font-size:14.5px}
/* ===== help chat ===== */
.chatfab{position:fixed;right:18px;bottom:18px;z-index:85;width:58px;height:58px;border-radius:50%;border:0;background:var(--blk);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.chatfab svg{width:27px;height:27px}
.chatfab::after{content:"";position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red) 50%,var(--gold) 50%)}
.chatfab:hover{transform:translateY(-2px)}
.chatbox{position:fixed;right:18px;bottom:88px;z-index:100;width:392px;max-width:calc(100vw - 24px);height:min(620px,calc(100vh - 110px));background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.chatbox[hidden]{display:none}
.chhead{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;background:var(--blk);color:#fff;position:relative}
.chhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red) 50%,var(--gold) 50%)}
.chhead div{margin-right:auto;min-width:0}.chhead b{display:block;font-size:16px;line-height:1.2}.chhead small{display:block;font-size:12px;opacity:.8;line-height:1.3}
.chhead button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;font-size:16px;display:grid;place-items:center;padding:0}
.chbody{flex:1;overflow-y:auto;padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex}.msg.me{justify-content:flex-end}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;word-break:break-word}
.msg.bot .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me .bub{background:var(--blk);color:#fff;border-bottom-right-radius:5px}
.bub a{color:var(--m);font-weight:600}
.bub ul{margin:6px 0 6px 18px;padding:0}.bub li{margin:2px 0}
.bub small{color:var(--mute)}
.bub .cb-bn{font-family:"Hind Siliguri",Inter,sans-serif;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.bub .wr{margin:6px 0;padding:7px 9px;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.bub .tb{margin:8px 0 0;padding:8px 10px;background:var(--soft);border:1px solid var(--line);border-radius:10px}.bub .tb .ocrtxt{margin:2px 0 4px}
.bub .aib{display:inline-block;margin-bottom:4px;color:var(--mute)}.bub .aimd p{margin:0 0 6px}.bub .aimd ul{margin:4px 0 6px 18px}
.ezchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.ezchips a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}.ezchips a:hover{border-color:var(--m);color:var(--m)}
.sb-ans{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;margin:10px 0;border:2px dashed var(--line);border-radius:12px;background:#fbf8f1}.sb-ans.ok{border-color:var(--ok);background:var(--okbg)}.sb-ans.bad{border-color:var(--bad);background:var(--badbg)}
.exline{padding:8px 0;border-top:1px solid #f0ebe0}.bad-s{color:var(--bad);text-decoration:line-through}
.ezcan{display:grid;gap:8px;margin:12px 0}.ezc{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}.ezc .bx{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #cfc6b3;display:grid;place-items:center;color:transparent;font-size:14px}.ezc.on{border-color:var(--ok);background:var(--okbg)}.ezc.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.topgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.topcard{display:block;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}.topcard:hover{transform:translateY(-2px);border-color:var(--m)}.topcard h3{margin:6px 0 2px}.topic-ic{font-size:30px}
.dots{display:inline-flex;gap:4px;align-items:center;height:18px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dots 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.chchips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:#fff;scrollbar-width:none}
.chchips::-webkit-scrollbar{display:none}
.chchips button{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.chchips button:hover{background:var(--hl)}
.chuml{display:flex;gap:4px;padding:6px 12px 0;background:#fff}
.chuml button{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);padding:0}
.chform{display:flex;gap:8px;padding:8px 12px 12px;background:#fff}
.chform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;background:var(--soft);color:var(--ink)}
.chform input:focus{outline:2px solid var(--gold);background:#fff}
.chform .btn{padding:9px 14px}
.stopfab{right:auto!important;left:18px}
@media(max-width:700px){
 .hide-s{display:none!important}
 .chatbox{right:8px;left:8px;bottom:8px;top:8px;width:auto;max-width:none;height:auto;border-radius:16px}
 body.chat-open .chatfab{display:none}
 .chatfab{right:14px;bottom:14px;width:54px;height:54px}
}
/* ===== word card / dictionary ===== */
.seg a{border:0;background:transparent;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;color:var(--mute);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.seg a.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.trtabs{margin-bottom:16px}
.wcard{margin-top:14px;border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:12px;padding:12px 14px;background:#fff}
.wcard.b-cm{border-left-color:var(--m)}.wcard.b-cf{border-left-color:var(--f)}.wcard.b-cn{border-left-color:var(--n)}.wcard.b-cp{border-left-color:var(--p)}
.wcard.guess{border-left-color:var(--gold);background:var(--almbg)}
.wc-top{font-size:22px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.wc-top .wpl{font-size:14px;font-weight:500;color:var(--mute)}
.wc-art{margin-top:4px;font-size:15px;font-weight:700}
.wc-m{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.wc-h{margin-top:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.wc-s{margin-top:6px;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:15px}
.wc-s .tr{font-size:14px;color:var(--mute)}
.bub .wcard{margin-top:8px;padding:9px 11px}.bub .wc-top{font-size:18px}
.trhelp .chipw b{font-weight:700}
.dctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.dctl input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:16px;background:var(--soft);color:var(--ink)}
.dctl input:focus{outline:2px solid var(--gold);background:#fff}
.dlets{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.dlets button{min-width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);padding:0 6px}
.dlets button:disabled{opacity:.3;cursor:default}
.dlets button:not(:disabled):hover{background:var(--hl)}
.dlet{font-family:Fraunces,serif;font-size:26px;margin:22px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold);scroll-margin-top:76px}
.drow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,1.2fr) auto;gap:4px 14px;align-items:center;padding:9px 12px 9px 14px;border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:12px;background:#fff;margin-bottom:6px}
.drow.b-cm{border-left-color:var(--m)}.drow.b-cf{border-left-color:var(--f)}.drow.b-cn{border-left-color:var(--n)}.drow.b-cp{border-left-color:var(--p)}
.dmain{font-size:18px;font-weight:600}.dpl{display:block;font-size:13.5px;font-weight:500;color:var(--mute)}
.dmean{display:flex;flex-direction:column;gap:1px;font-size:15px}.dm-b{font-family:"Hind Siliguri",Inter,sans-serif}.dm-e{color:var(--mute)}
.dxx{grid-column:1/-1}
.dxx[hidden]{display:none}
.dempty{padding:26px;text-align:center;color:var(--mute)}
@media(max-width:620px){.drow{grid-template-columns:1fr auto}.dmean{grid-column:1/2}}
/* ===== chat: photo / camera / voice ===== */
.chtool{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.chtool svg{width:19px;height:19px}
.chtool:hover{background:var(--hl)}
.chtool.on{background:var(--red);border-color:var(--red);color:#fff;animation:micp 1.1s infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(215,38,61,.45)}50%{box-shadow:0 0 0 8px rgba(215,38,61,0)}}
.chuml .vl{margin-left:auto;width:auto;padding:0 10px;font-size:13px;font-weight:600}
.chform{align-items:center;gap:6px}
.ocrth{display:block;max-width:110px;max-height:110px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px}
.ocrtxt{white-space:pre-wrap;margin-top:4px;padding:8px 10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;font-size:14.5px}
.ocrtxt[lang=bn]{font-family:"Hind Siliguri",Inter,sans-serif;font-size:16px;background:#fffdf3}
.ocren{margin-top:6px}
.bub .trbtns{margin-top:8px}
.chcam{position:absolute;inset:0;z-index:5;background:#000;display:flex;flex-direction:column}
.chcam[hidden]{display:none}
.chcam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.chcam div{display:flex;gap:10px;justify-content:center;padding:12px;background:#111}
.chcam .btn{padding:10px 18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- polish & responsive pass ---- */
html{-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
img,svg,video,canvas{max-width:100%}
pre,code{overflow-x:auto;max-width:100%}
table{max-width:100%}
.btn,.opt,.seg button{min-height:40px}
.btn{transition:transform .12s,box-shadow .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,25,10,.08)}
.btn:active{transform:translateY(0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.kicker a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.pagehead h1{line-height:1.15;word-break:break-word}
.pagehead .trbtns{margin-top:12px}
.card{box-shadow:0 1px 2px rgba(30,25,10,.04),0 6px 18px rgba(30,25,10,.04)}
.topgrid{gap:16px}
.topcard{display:flex;flex-direction:column;gap:2px;height:100%}
.topcard>.en{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.topcard>.bn{display:none}
.topcard small{margin-top:auto;padding-top:10px}
.topcard:hover{box-shadow:0 10px 26px rgba(30,25,10,.1)}
.opts{gap:10px}
.opt{min-height:44px;text-align:left}
.opt.right{background:#e6f5ec;border-color:var(--ok)}
.opt.wrong{background:#fdeaed;border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;background:#faf6ec;border:1px solid var(--line)}
details{margin-top:8px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
textarea.win{width:100%;max-width:100%;box-sizing:border-box;margin:8px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;resize:vertical}
.sec{scroll-margin-top:76px}
.sech{flex-wrap:wrap;gap:4px 12px}
#rvBox .btn,#bkBox .btn{min-width:120px;justify-content:center}
@media(max-width:700px){
 .hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .hero-cta .btn{justify-content:center;text-align:center;padding:10px 8px;font-size:13px}
 .hero-cta .btn.gold{grid-column:1/-1;font-size:15px;padding:13px}
 .hero-cta .btn svg{display:none}
 .pagehead h1{font-size:28px}
 .topgrid{grid-template-columns:1fr 1fr;gap:10px}
 .topcard{padding:14px 12px}
 .topcard h3{font-size:16px}
 .topcard>.en{-webkit-line-clamp:2;font-size:13px}
 .topic-ic{font-size:26px}
 .opts{flex-direction:column}
 .opt{width:100%}

tip:[
["Gender secrets – the ending often tells you the article. <span class=cf>die</span>: -ung, -heit, -keit, -schaft, -ion, -tät, -ie, -ik, -ur (die Zeitung, die Information). <span class=cn>das</span>: -chen, -lein, -ment, -um (das Mädchen, das Zentrum). <span class=cm>der</span>: -er for people and tools, -ling, -ismus, days, months, seasons (der Lehrer, der Montag). The full list is on the ‘Grammar secrets’ page.","লিঙ্গের গোপন কৌশল – শব্দের শেষাংশ দেখে প্রায়ই আর্টিকেল বোঝা যায়। <span class=cf>die</span>: -ung, -heit, -keit, -schaft, -ion, -tät, -ie, -ik, -ur (die Zeitung, die Information)। <span class=cn>das</span>: -chen, -lein, -ment, -um (das Mädchen, das Zentrum)। <span class=cm>der</span>: মানুষ ও যন্ত্রের -er, -ling, -ismus, সপ্তাহের দিন, মাস, ঋতু (der Lehrer, der Montag)। সম্পূর্ণ তালিকা ‘Grammar secrets’ পাতায়।"],
["In compound nouns the <b>last word decides the article</b>: das Wort + das Buch = <span class=cn>das</span> Wörterbuch; die Hand + der Schuh = <span class=cm>der</span> Handschuh (glove).","যৌগিক বিশেষ্যে <b>শেষ শব্দটিই আর্টিকেল ঠিক করে</b>: das Wort + das Buch = <span class=cn>das</span> Wörterbuch; die Hand + der Schuh = <span class=cm>der</span> Handschuh (দস্তানা)।"]],

{h:"Der Imperativ – giving instructions",
en:"<b>Sie</b>-form: verb first + Sie. <b>du</b>-form: take the du-form and drop <b>-st</b> and du (du kommst → <i>Komm!</i>). The change e→i stays (du nimmst → <i>Nimm!</i>), but a→ä does not (du fährst → <i>Fahr!</i>). <b>ihr</b>-form = ihr-form without ihr. Separable verbs: prefix at the end.",
bn:"<b>Sie</b>-রূপ: প্রথমে ক্রিয়া + Sie। <b>du</b>-রূপ: du-রূপ থেকে <b>-st</b> আর du বাদ দাও (du kommst → <i>Komm!</i>)। e→i পরিবর্তন থাকে (du nimmst → <i>Nimm!</i>), কিন্তু a→ä থাকে না (du fährst → <i>Fahr!</i>)। <b>ihr</b>-রূপ = ihr ছাড়া ihr-রূপ। বিভাজ্য ক্রিয়া: উপসর্গ শেষে।",

["Rahim","Mir geht es nicht gut. Ich habe Kopfschmerzen und Fieber.","I don't feel well. I have a headache and a fever.","আমার শরীর ভালো না। মাথা ব্যথা আর জ্বর।"],

{h:"Verben mit Dativ – verbs with the dative",
en:"Some verbs always take the dative (wem?): <b>gefallen, gehören, helfen, danken, schmecken, gratulieren, passen, antworten</b>. <b>gefallen</b> works like Bangla ‘আমার ভালো লাগে’: the thing is the subject, the person is in the dative. Plural: <i>Die Blumen gefallen mir.</i>",
bn:"কিছু ক্রিয়া সবসময় ডেটিভ নেয় (wem?): <b>gefallen, gehören, helfen, danken, schmecken, gratulieren, passen, antworten</b>। <b>gefallen</b> বাংলার ‘আমার ভালো লাগে’-এর মতো: জিনিসটা কর্তা, মানুষটা ডেটিভে। বহুবচন: <i>Die Blumen gefallen mir.</i>",

["Informal: Your friend Paul invited you for Saturday. You can't come. Say sorry, give a reason and suggest another day.","অনানুষ্ঠানিক: তোমার বন্ধু পল শনিবারের জন্য দাওয়াত দিয়েছে। তুমি যেতে পারবে না। দুঃখ প্রকাশ করো, কারণ বলো আর অন্য একটা দিন প্রস্তাব করো।","Lieber Paul, vielen Dank für die Einladung! Leider kann ich am Samstag nicht kommen, denn meine Eltern besuchen mich. Hast du am Sonntag Zeit? Viele Grüße, Karim","Dear Paul, thanks a lot for the invitation! Unfortunately I can't come on Saturday because my parents are visiting me. Do you have time on Sunday? Best wishes, Karim","প্রিয় পল, দাওয়াতের জন্য অনেক ধন্যবাদ! দুঃখিত, শনিবার আসতে পারব না, কারণ আমার বাবা-মা আমার কাছে বেড়াতে আসছেন। রবিবার কি তোমার সময় আছে? শুভেচ্ছাসহ, করিম"]]}],

function toast(msg,ms){const t=$('#toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms||2600);}

/* text that looks like English (so we don't read it with a German voice) */
const EN_RE=/\b(the|you|how|hello|goodbye|only|like|verb|position|statement|question|noun|everything|else|from|not|are|many|almost|words|ending|foreign|change|female|which|form|correct|plural|answer|year|of|and|write|your)\b/i;
const BN_RE=/[ঀ-৿]/;

/* ---------- AUDIO (Web Speech API, made robust) ---------- */
const TTS={
  ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
  all:[],voices:[],voice:null,loaded:false,
  rate:parseFloat(store.get('rate',0.9))||0.9,
  pref:store.get('voice',''),
  queue:[],cur:null,keep:[],el:null,wd:0,tok:0,onDone:null,
  init(){
    if(!this.ok){updAudioStatus();return;}
    const l=()=>this.load();
    l();
    try{speechSynthesis.addEventListener('voiceschanged',l);}catch(e){speechSynthesis.onvoiceschanged=l;}
    let n=0;const t=setInterval(()=>{n++;l();if(this.voices.length||n>25){clearInterval(t);this.tried=true;updAudioStatus();}},300);
  },
  load(){
    let all=[];try{all=speechSynthesis.getVoices()||[];}catch(e){}
    this.all=all;this.loaded=all.length>0;
    this.voices=all.filter(v=>/^de(\b|[-_])/i.test(v.lang||''));
    let v=null;
    if(this.pref) v=all.find(x=>x.voiceURI===this.pref||x.name===this.pref)||null;
    this.voice=v||this.best();
    updAudioStatus();
  },
  score(v){let s=0;if(/de[-_]DE/i.test(v.lang))s+=4;if(/google/i.test(v.name))s+=3;if(/natural|online|neural|premium|enhanced/i.test(v.name))s+=3;if(/katja|conrad|amala|anna|helena|petra|markus|yannick|seraphina|florian/i.test(v.name))s+=1;if(/espeak/i.test(v.name))s-=5;return s;},
  best(){return this.voices.slice().sort((a,b)=>this.score(b)-this.score(a))[0]||null;},
  clean(t){
    return strip(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/_{2,}/g,' … ').replace(/\s+\/\s+/g,', ').replace(/[„“”"«»‘’]/g,'')
      .replace(/[→=·|]/g,', ').replace(/\s[–—-]\s/g,', ').replace(/\s+/g,' ').trim();
  },
  chunks(t){
    t=this.clean(t);if(t.length<=170)return t?[t]:[];
    const parts=t.match(/[^.!?]+[.!?]*/g)||[t];const out=[];let buf='';
    parts.forEach(p=>{if((buf+p).length>170&&buf){out.push(buf.trim());buf=p;}else buf+=p;});
    if(buf.trim())out.push(buf.trim());return out;
  },
  say(text,el,opt){const c=this.chunks(text);if(!c.length)return;this.play(c.map(x=>Object.assign({t:x,el:el},opt||{})));},
  play(items,onDone){
    if(!this.ok){audioHelp('none');return;}
    if(!this.voices.length)this.load();
    const prev=this.onDone;this.onDone=null;if(prev)prev();
    this.tok++;const tok=this.tok;
    let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;}catch(e){}
    this.cur=null;clearTimeout(this.wd);
    try{speechSynthesis.cancel();}catch(e){}
    this.mark(null);
    this.queue=items.slice();this.onDone=onDone||null;
    showStop(true);
    if(busy)setTimeout(()=>{if(tok===this.tok)this.next(false);},90);else this.next(false);
  },
  next(retry){
    const it=this.queue.shift();if(!it){this.done();return;}
    const tok=this.tok;
    const u=new SpeechSynthesisUtterance(it.t);
    const v=it.voice||this.voice;
    u.lang=v?String(v.lang).replace('_','-'):'de-DE';
    if(v)u.voice=v;
    u.rate=it.rate||this.rate;u.pitch=it.pitch||1;u.volume=1;
    let started=false;
    const st=()=>{started=true;if(tok===this.tok)this.mark(it.el);};
    u.onstart=st;u.onboundary=()=>{if(!started)st();};
    u.onend=()=>{
      if(tok!==this.tok||this.cur!==u)return;
      this.cur=null;clearTimeout(this.wd);
      if(this.queue.length)setTimeout(()=>{if(tok===this.tok)this.next(false);},it.gap!=null?it.gap:220);
      else this.done();
    };
    u.onerror=(e)=>{
      if(tok!==this.tok||this.cur!==u)return;
      this.cur=null;clearTimeout(this.wd);
      const er=e&&e.error;
      if(er==='interrupted'||er==='canceled')return;
      this.done();
      if(er==='not-allowed')toast('🔊 Tap the speaker again · আবার স্পিকারে চাপ দাও');
      else audioHelp(er||'error');
    };
    this.cur=u;this.keep.push(u);if(this.keep.length>40)this.keep.shift();
    try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}
    try{speechSynthesis.speak(u);}catch(e){this.done();audioHelp('exception');return;}
    clearTimeout(this.wd);
    this.wd=setTimeout(()=>{
      if(tok!==this.tok||this.cur!==u||started)return;
      // speech engine is stuck – reset it and try once more
      this.cur=null;try{speechSynthesis.cancel();}catch(e){}
      if(!retry){this.queue.unshift(it);setTimeout(()=>{if(tok===this.tok)this.next(true);},200);}
      else{this.done();audioHelp('stuck');}
    },6000);
  },
  done(){
    clearTimeout(this.wd);this.cur=null;this.queue=[];this.mark(null);showStop(false);
    const f=this.onDone;this.onDone=null;if(f)f();
  },
  stop(){this.tok++;this.queue=[];this.cur=null;try{speechSynthesis.cancel();}catch(e){}this.done();},
  mark(el){if(this.el)this.el.classList.remove('speaking');this.el=el||null;if(el){el.classList.add('speaking');}}
};
function showStop(on){const b=$('#stopBtn');if(b)b.hidden=!on;}
function updAudioStatus(){
  let h;
  if(!TTS.ok)h=`<span class="warn">⚠ ${L('This browser cannot play speech. Please open the link in Chrome, Edge or Safari.','এই ব্রাউজারে অডিও চলে না। লিংকটি Chrome, Edge বা Safari-তে খুলুন।')}</span>`;
  else if(!TTS.loaded&&!TTS.tried)h=`<span class="mute">${L('Loading voices… (tap a speaker to start)','ভয়েস লোড হচ্ছে… (শুরু করতে স্পিকারে চাপ দিন)')}</span>`;
  else if(!TTS.voices.length)h=`<span class="warn">⚠ ${L('No German voice found on this device – audio may sound English.','এই ডিভাইসে জার্মান ভয়েস নেই – উচ্চারণ ইংরেজির মতো শোনাতে পারে।')}</span> <button data-act="audiohelp">${L('How to fix','কীভাবে ঠিক করবেন')}</button>`;
  else h=`✅ ${L('German voice','জার্মান ভয়েস')}: <b>${esc(TTS.voice?TTS.voice.name:'Deutsch')}</b>`;
  $$('.astatus').forEach(e=>e.innerHTML=h);
  const sel=$('#vsel');if(sel&&!sel.dataset.filled)fillVoiceSel();
}
function say(html,text){const t=text!=null?text:strip(html);return `<span class="say" role="button" tabindex="0" data-say="${esc(t)}">${html}${IC.mini}</span>`;}
function sayBtn(text){return `<button type="button" class="spk say" data-say="${esc(text)}" aria-label="anhören / শুনুন">${IC.spk}</button>`;}

  if(['en','bn','both'].indexOf(l)<0)l='both';
  document.body.classList.remove('l-en','l-bn','l-both');document.body.classList.add('l-'+l);
  store.set('lang',l);

/* ---------- vocab helpers ---------- */
function artClass(w,pl){const m=/^(der|die|das)\s/.exec(w);if(!m)return'';if(m[1]==='die'&&pl==='Pl.')return'cp';return{der:'cm',die:'cf',das:'cn'}[m[1]];}
function wordHtml(w,pl){const c=artClass(w,pl);const e=esc(w);return c?e.replace(/^(der|die|das) /,`<span class="${c}">$1</span> `):e;}
function vrow(v,n){
  const [w,pl,en,bn]=v;const c=artClass(w,pl);
  let p='';
  if(pl==='Pl.')p=`<span class="cp">${L('only plural','শুধু বহুবচন')}</span>`;
  else if(pl==='-'||pl==='–')p='<span class="mute">—</span>';
  else if(pl)p=say(`<span class="cp">die</span> ${esc(pl)}`,'die '+pl);
  return `<div class="vrow ${c?'b-'+c:''}"><div class="vw">${say(wordHtml(w,pl),w)}${n?`<a class="dpill" href="#day-${n}">Tag ${n}</a>`:''}</div><div class="vp">${p}</div><div class="vm en">${esc(en)}</div><div class="vm bn">${esc(bn)}</div></div>`;
}
function vlist(list,withDay){
  return `<div class="vlist"><div class="vrow h"><div>Deutsch</div><div>Plural</div><div class="en">English</div><div class="bn">বাংলা</div></div>${list.map(x=>withDay?vrow(x.v,x.n):vrow(x)).join('')}</div>`;
}

/* ---------- grammar rendering ---------- */
function cell(c,kind,noSay){
  if(kind==='en')return `<td class="en">${c}</td>`;
  if(kind==='bn')return `<td class="bn">${c}</td>`;
  const txt=strip(c).trim();let t=txt;
  if(noSay)return `<td>${c}</td>`;
  if(/^[A-ZÄÖÜ] [a-zäöü]$/.test(t))t=t[0];
  else if(t==='ß')t='Eszett';
  else if(!/[A-Za-zÄÖÜäöüß]{2,}/.test(t)&&!/^[A-ZÄÖÜ]$/.test(t))return `<td>${c}</td>`;
  if(EN_RE.test(t)||BN_RE.test(t))return `<td>${c}</td>`;
  return `<td>${say(c,t)}</td>`;
}
function table(t){
  const k=t.k||[];const noSay=t.h.map(x=>/^(Regel|Typ|Tip|Endung|Abkürzung)$/i.test(strip(x)));
  let h='';if(t.c)h+=`<div class="tcap">${esc(t.c)}</div>`;
  h+='<div class="tbl"><table><thead><tr>'+t.h.map((x,i)=>`<th class="${k[i]||''}">${x}</th>`).join('')+'</tr></thead><tbody>';
  t.r.forEach(r=>{h+='<tr>'+r.map((c,i)=>cell(c,k[i],noSay[i])).join('')+'</tr>';});
  return h+'</tbody></table></div>';
}
function exList(ex){return `<ul class="exs">${ex.map(e=>`<li>${say(esc(e[0]),e[0])}<div class="en tr">${esc(e[1])}</div><div class="bn tr">${esc(e[2])}</div></li>`).join('')}</ul>`;}
function gramCard(g){
  let h=`<div class="card gram"><h3>${esc(g.h)}</h3>`;
  if(g.en)h+=`<p class="en">${g.en}</p>`;if(g.bn)h+=`<p class="bn">${g.bn}</p>`;
  (g.tb?(Array.isArray(g.tb)?g.tb:[g.tb]):[]).forEach(t=>h+=table(t));
  if(g.ex)h+=exList(g.ex);
  return h+'</div>';
}

/* ---------- exercises ---------- */
const n1=s=>String(s).normalize('NFC').trim().replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'');
const fold=s=>n1(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
function grade(u,alts){for(const a of alts)if(n1(u)===n1(a))return[2,a];for(const a of alts)if(fold(u)===fold(a))return[1,a];return[0,alts[0]];}
const sentNorm=s=>fold(s).replace(/[^a-z0-9äöüß]+/g,' ').trim();
function fullS(t,a){
  let s=t.indexOf('___')>=0?t.replace('___',a):t+' '+a;
  s=s.replace(/\s*\([^)]*\)\s*$/,'').trim();
  if(/^\d+\s*=/.test(s))s=a;
  if(s.indexOf('→')>=0)s=s.split('→')[1].trim();
  return s;
}
function qSpeakable(q){return q.indexOf('___')<0&&!EN_RE.test(q)&&!/^„/.test(q)&&/[a-zäöü]{2,}/i.test(q)&&!/[=:]\s*$/.test(q)&&!BN_RE.test(q);}
function optSpeakable(o){return !BN_RE.test(o)&&!/[()]/.test(o)&&/[a-zäöü]{2,}/i.test(o)&&!EN_RE.test(o)&&['formell','informell','richtig','falsch'].indexOf(o)<0;}
function blankify(s){return esc(s).replace('___','<span class="blank"></span>');}

function exBlock(e,i,dn){
  let h=`<div class="card ex" data-ex="${i}" data-k="${e.k}"><div class="exhead"><span class="exnum">Übung ${i+1}</span><h3><span class="en">${e.h[0]}</span><span class="bn">${e.h[1]}</span></h3></div><ol class="exq">`;
  if(e.k==='mc'){
    e.q.forEach((q,j)=>{
      const qt=qSpeakable(q[0])?say(esc(q[0]),q[0]):blankify(q[0]);
      h+=`<li class="mcq" data-j="${j}"><div class="qt">${qt}</div><div class="opts">${q[1].map((o,oi)=>`<button type="button" class="opt" data-act="mc" data-o="${oi}">${esc(o)}</button>`).join('')}</div><div class="fb"></div></li>`;
    });
    h+=`</ol><div class="exbtns"><button class="btn xs" data-act="exreset">↺ ${L('Try again','আবার চেষ্টা')}</button></div>`;
  }else if(e.k==='fill'){
    e.q.forEach((q,j)=>{
      const w=Math.max(4,...q[1].split('|').map(a=>a.length))+2;
      const inp=`<input class="fin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:${w}ch" aria-label="Antwort">`;
      const t=esc(q[0]);
      h+=`<li class="fq" data-j="${j}"><div class="qt">${t.indexOf('___')>=0?t.replace('___',inp):t+' '+inp}</div><div class="fb"></div></li>`;
    });
    h+=`</ol><div class="exbtns"><button class="btn primary xs" data-act="excheck">${IC.check} ${L('Check','যাচাই করো')}</button><button class="btn xs" data-act="exshow">${L('Show answers','উত্তর দেখাও')}</button><button class="btn xs" data-act="exreset">↺ ${L('Reset','মুছে দাও')}</button></div>`;
  }else if(e.k==='tr'){
    e.q.forEach((q,j)=>{
      h+=`<li class="tq" data-j="${j}"><div class="prompt"><span class="en">${esc(q[0])}</span><span class="bn">${esc(q[1])}</span></div><input class="tin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Auf Deutsch … / জার্মানে লেখো …"><div class="fb"></div></li>`;
    });
    h+=`</ol><div class="exbtns"><button class="btn primary xs" data-act="excheck">${IC.check} ${L('Check','যাচাই করো')}</button><button class="btn xs" data-act="exshow">${L('Show answers','উত্তর দেখাও')}</button><button class="btn xs" data-act="exreset">↺ ${L('Reset','মুছে দাও')}</button></div>`;
  }else if(e.k==='wr'){
    e.q.forEach((q,j)=>{
      const key=`w:${dn}:${i}:${j}`;
      h+=`<li class="wq" data-j="${j}"><div class="prompt"><span class="en">${esc(q[0])}</span><span class="bn">${esc(q[1])}</span></div><textarea class="win" data-key="${key}" placeholder="Schreib hier … / এখানে লেখো …">${esc(store.get(key,''))}</textarea><div class="exbtns" style="border:0;padding-top:0;margin-top:8px"><button class="btn xs" data-act="model">${L('Show model answer','নমুনা উত্তর দেখাও')}</button></div><div class="model" hidden>${say(esc(q[2]),q[2])}<div class="en tr" style="margin-top:6px">${esc(q[3]||'')}</div><div class="bn tr">${esc(q[4]||'')}</div></div></li>`;
    });
    h+='</ol>';
  }else h+='</ol>';
  return h+'</div>';
}

let CUR=null; // {d, res:{}}
function scoreTotal(){let t=0;(CUR.d.ex||[]).forEach(e=>{if(e.k==='mc'||e.k==='fill'||e.k==='tr')t+=e.q.length;});return t;}
function updScore(){
  if(!CUR)return;const tot=scoreTotal();if(!tot)return;
  const vals=Object.values(CUR.res);const ok=vals.filter(Boolean).length;const done=vals.length;
  const pct=Math.round(ok/tot*100);
  const best=store.get('best',{});
  if(pct>(best[CUR.d.n]||0)){best[CUR.d.n]=pct;store.set('best',best);}
  const goal=CUR.d.review?` · ${L('goal: 90 %','লক্ষ্য: ৯০ %')}`:'';
  $$('.score').forEach(s=>{s.innerHTML=`<b>${ok} / ${tot}</b><span>${L('correct','সঠিক')}</span><div class="bar"><i style="width:${pct}%"></i></div><span><b>${pct} %</b> · ${done}/${tot} ${L('answered','উত্তর')}${goal} · ${L('best','সেরা')} ${best[CUR.d.n]||0} %</span>`;});
}
function doMC(btn){
  const li=btn.closest('.mcq');if(li.classList.contains('answered'))return;
  const card=btn.closest('.ex');const i=+card.dataset.ex,j=+li.dataset.j;
  const q=CUR.d.ex[i].q[j];const o=+btn.dataset.o;const ok=o===q[2];
  li.classList.add('answered',ok?'is-ok':'is-bad');
  $$('.opt',li).forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('right');else if(k===o)b.classList.add('wrong');});
  CUR.res[i+':'+j]=ok;
  const right=q[1][q[2]];let fb=ok?`<b class="okc">✓ Richtig!</b>`:`<b class="badc">✗</b> <span class="sol">${esc(right)}</span>`;
  let sp=null;if(q[0].indexOf('___')>=0)sp=fullS(q[0],right);else if(optSpeakable(right))sp=right;
  if(sp){fb+=' '+say(esc(sp),sp);}
  $('.fb',li).innerHTML=fb;
  updScore();
}
function exAction(card,mode){
  const i=+card.dataset.ex;const e=CUR.d.ex[i];
  if(e.k==='mc'){
    if(mode==='reset'){$$('.mcq',card).forEach(li=>{li.className='mcq';$('.fb',li).innerHTML='';$$('.opt',li).forEach(b=>{b.disabled=false;b.className='opt';});delete CUR.res[i+':'+li.dataset.j];});updScore();}
    return;
  }
  if(e.k==='fill'||e.k==='tr'){
    let empty=0;
    $$('li',card).forEach(li=>{
      const j=+li.dataset.j,q=e.q[j],key=i+':'+j,inp=$('input',li),fb=$('.fb',li);
      const alts=e.k==='fill'?q[1].split('|'):q[2].split('|');
      const base=e.k==='fill'?li.className.split(' ')[0]:'tq';
      if(mode==='reset'){inp.value='';li.className=base;fb.innerHTML='';delete CUR.res[key];return;}
      if(mode==='show'){
        if(CUR.res[key]===true)return;
        inp.value=alts[0];li.className=base+' shown';CUR.res[key]=false;
        const s=e.k==='fill'?fullS(q[0],alts[0]):alts[0];
        fb.innerHTML=`<span class="mute">${L('Answer','উত্তর')}:</span> ${say(esc(e.k==='fill'?alts.join(' / '):alts[0]),s)}`;
        return;
      }
      const v=inp.value;if(!v.trim()){empty++;li.className=base;fb.innerHTML='';return;}
      if(e.k==='fill'){
        const [g,a]=grade(v,alts);CUR.res[key]=g>0;
        li.className=base+' '+(g===2?'is-ok':g===1?'is-almost':'is-bad');
        const s=fullS(q[0],g?a:alts[0]);
        fb.innerHTML=(g===2?'<b class="okc">✓ Richtig!</b>':g===1?`<b class="almc">✓ ${L('Almost! Exactly','প্রায় ঠিক! সঠিক বানান')}: ${esc(a)}</b>`:`<b class="badc">✗</b> <span class="sol">${esc(alts.join(' / '))}</span>`)+' '+sayBtn(s);
      }else{

function filterWords(){
  const q=fold(WF.q||'');
  WLIST=allWords().filter(x=>{
    if(WF.d){if(String(WF.d)[0]==='w'){if('w'+x.w!==WF.d)return false;}else if(String(x.n)!==String(WF.d))return false;}
    const c=artClass(x.v[0],x.v[1]);
    if(WF.a==='der'&&c!=='cm')return false;if(WF.a==='die'&&c!=='cf')return false;if(WF.a==='das'&&c!=='cn')return false;if(WF.a==='pl'&&c!=='cp')return false;if(WF.a==='other'&&c)return false;
    if(q){const hay=fold(x.v.join(' '));if(hay.indexOf(q)<0)return false;}
    return true;
  });
  const wl=$('#wlist');if(!wl)return;
  wl.innerHTML=WLIST.length?vlist(WLIST,true):`<div class="card mute">${L('No words found.','কোনো শব্দ পাওয়া যায়নি।')}</div>`;
  $('#wc').textContent=WLIST.length+' Wörter';
}

function rcol(cls,art,rows){return `<div class="rcol ${cls}"><h4>${art}</h4>${rows.map(r=>`<div class="rrow"><div><span class="end">${r[0]}</span><small class="en">${r[2]||''}</small><small class="bn">${r[3]||''}</small></div><div>${say(esc(r[1]),r[1])}</div></div>`).join('')}</div>`;}
function blocks(parts,verbIdx){return `<div class="blocks">${parts.map((p,i)=>`<span class="blk ${i===verbIdx?'v':''}"><small>${i===verbIdx?'Verb':'Pos. '+(i+1)}</small>${esc(p)}</span>`).join('')} ${sayBtn(parts.join(' '))}</div>`;}
function srows(rows){return rows.map(r=>`<div class="srow"><div class="k"><span class="en">${r[0]}</span><span class="bn">${r[1]}</span></div><div class="v">${r[2].map(x=>say(esc(x),x)).join(', ')}</div></div>`).join('');}
function showSecrets(){
  let h=`<div class="pagehead"><div class="kicker">Extras</div><h1>Grammatik-Geheimnisse</h1><p class="en">Short cuts that make German much easier. Learn these patterns once – they help you every day.</p><p class="bn">যে কৌশলগুলো জার্মানকে অনেক সহজ করে দেয়। একবার শিখে নাও – প্রতিদিন কাজে লাগবে।</p></div>`;
  h+=sec('s1','1 · Der, die oder das?',L('The ending tells you the article','শেষাংশ দেখেই আর্টিকেল চেনা যায়'),`<div class="card"><p class="en">You cannot guess every article, but many nouns follow clear patterns. Look at the <b>ending</b> first! There are exceptions (der Name, der Käse, das Auge, das Fenster, die Butter) – so always learn the article with the noun.</p><p class="bn">সব আর্টিকেল অনুমান করা যায় না, তবে অনেক বিশেষ্য পরিষ্কার নিয়ম মানে। আগে শব্দের <b>শেষাংশ</b> দেখো! ব্যতিক্রম আছে (der Name, der Käse, das Auge, das Fenster, die Butter) – তাই সবসময় আর্টিকেলসহ শব্দ শেখো।</p>
  <div class="rcols">${rcol('rc-f','die',[['-ung','die Zeitung'],['-heit','die Freiheit'],['-keit','die Möglichkeit'],['-schaft','die Freundschaft'],['-ion','die Information'],['-tät','die Universität'],['-ie','die Familie'],['-ik','die Musik'],['-ur','die Kultur'],['-ei','die Bäckerei'],['-in','die Lehrerin','women','নারী'],['-e','die Lampe','most words','বেশিরভাগ শব্দ']])}
  ${rcol('rc-n','das',[['-chen','das Mädchen'],['-lein','das Büchlein'],['-ment','das Dokument'],['-um','das Zentrum'],['-ma','das Thema'],['Ge-','das Gemüse','often','প্রায়ই'],['-nis','das Ergebnis','mostly','বেশিরভাগ'],['-o','das Kino','often','প্রায়ই'],['Verb → Nomen','das Essen','verbs as nouns','ক্রিয়া থেকে বিশেষ্য']])}
  ${rcol('rc-m','der',[['♂','der Vater','men, male jobs','পুরুষ, পুরুষের পেশা'],['-er','der Lehrer','people & tools','মানুষ ও যন্ত্র'],['-ling','der Frühling'],['-ismus','der Tourismus'],['-or','der Motor'],['-ist','der Polizist'],['-ant','der Praktikant'],['Tage','der Montag','days','সপ্তাহের দিন'],['Monate','der Mai','months','মাস'],['Jahreszeiten','der Sommer','seasons','ঋতু'],['Wetter','der Regen','weather','আবহাওয়া'],['Richtungen','der Norden','directions','দিক']])}</div></div>`);
  h+=sec('s2','2 · Das Verb auf Position 2',L('The golden word-order rule','বাক্যগঠনের সোনালি নিয়ম'),`<div class="card"><p class="en">In statements and W-questions the conjugated verb is always <b>block 2</b>. Count blocks, not words. In yes/no questions the verb is <b>block 1</b>.</p><p class="bn">সাধারণ বাক্য ও W-প্রশ্নে ক্রিয়া সবসময় <b>দ্বিতীয় অংশে</b>। শব্দ নয়, অংশ গোনো। হ্যাঁ/না প্রশ্নে ক্রিয়া থাকে <b>প্রথম অংশে</b>।</p>${blocks(['Ich','wohne','in Köln.'],1)}${blocks(['Jetzt','wohne','ich','in Köln.'],1)}${blocks(['Heute','lerne','ich','Deutsch.'],1)}${blocks(['Wo','wohnst','du?'],1)}${blocks(['Wohnst','du','in Köln?'],0)}</div>`);
  h+=sec('s3','3 · ein = kein = mein',L('One pattern, three words','এক নিয়ম, তিন শব্দ'),`<div class="card"><p class="en"><b>kein</b> and all possessives (mein, dein, sein, ihr, unser, euer, Ihr) take exactly the same endings as <b>ein</b>. Learn one – get all of them free.</p><p class="bn"><b>kein</b> এবং সব অধিকারবাচক শব্দ (mein, dein, sein, ihr, unser, euer, Ihr) ঠিক <b>ein</b>-এর মতো শেষাংশ নেয়। একটা শিখলে বাকিগুলো ফ্রি।</p>${table({h:['','ein','kein','mein'],r:[['<span class=cm>der</span>','ein Vater','kein Vater','mein Vater'],['<span class=cf>die</span>','eine Mutter','keine Mutter','meine Mutter'],['<span class=cn>das</span>','ein Kind','kein Kind','mein Kind'],['<span class=cp>Plural</span>','– Kinder','keine Kinder','meine Kinder']]})}</div>`);
  h+=sec('s4','4 · Plural-Abkürzungen',L('Plural short cuts','বহুবচনের সহজ কৌশল'),`<div class="card">${srows([
    ['The plural article is <b>always die</b>.','বহুবচনের আর্টিকেল <b>সবসময় die</b>।',['die Tische','die Bücher']],
    ['Feminine nouns in -e → add <b>-n</b>.','-e দিয়ে শেষ স্ত্রীলিঙ্গ শব্দ → <b>-n</b> যোগ।',['die Lampe, die Lampen','die Tasche, die Taschen']],
    ['-in → <b>-innen</b>.','-in → <b>-innen</b>।',['die Lehrerin, die Lehrerinnen']],
    ['der/das in -er, -el, -en, -chen → <b>no change</b>.','-er, -el, -en, -chen দিয়ে শেষ der/das শব্দ → <b>কোনো পরিবর্তন নেই</b>।',['der Lehrer, die Lehrer','das Mädchen, die Mädchen']],
    ['Ends in -a, -i, -o, -u, -y or foreign word → <b>-s</b>.','-a, -i, -o, -u, -y দিয়ে শেষ বা বিদেশি শব্দ → <b>-s</b>।',['das Auto, die Autos','das Handy, die Handys']],
    ['Short der-words → <b>-e</b>, often with umlaut.','ছোট der-শব্দ → <b>-e</b>, প্রায়ই উমলাউটসহ।',['der Tisch, die Tische','der Stuhl, die Stühle']],
    ['Short das-words → <b>-er</b> + umlaut.','ছোট das-শব্দ → <b>-er</b> + উমলাউট।',['das Buch, die Bücher','das Kind, die Kinder']]])}</div>`);
  h+=sec('s5','5 · Aussprache-Tricks',L('Pronunciation tricks','উচ্চারণের কৌশল'),`<div class="card">${srows([
    ['<b>ei</b> or <b>ie</b>? Say the <b>second</b> letter the English way: ei → “eye”, ie → “ee”.','<b>ei</b> নাকি <b>ie</b>? <b>দ্বিতীয়</b> অক্ষরটা ইংরেজির মতো বলো: ei → “আই”, ie → “ঈ”।',['mein','drei','vier','Liebe']],
    ['<b>w</b> sounds like v, <b>v</b> sounds like f.','<b>w</b> উচ্চারণ ভ, <b>v</b> উচ্চারণ ফ।',['Wasser','Vater','Volkswagen']],
    ['<b>z</b> = ts.','<b>z</b> = ৎস।',['Zeit','zehn','Zug']],
    ['<b>st- / sp-</b> at the start = scht / schp.','শুরুতে <b>st- / sp-</b> = শ্ট / শ্প।',['Straße','Sport','Stadt']],
    ['<b>b, d, g</b> at the end = p, t, k.','শেষে <b>b, d, g</b> = প, ট, ক।',['halb','Kind','Tag']],
    ['<b>-er</b> at the end sounds like a short “a”.','শেষের <b>-er</b> ছোট “আ”-এর মতো।',['Vater','Lehrer','Wasser']],
    ['<b>ch</b>: throaty after a/o/u, soft after e/i.','<b>ch</b>: a/o/u-এর পরে গলা থেকে, e/i-এর পরে নরম।',['Buch','acht','ich','nicht']]])}</div>`);
  h+=sec('s6','6 · Verben: die Endung verrät die Person',L('Verb endings show the person','ক্রিয়ার শেষাংশ কর্তা বলে দেয়'),`<div class="card">${srows([
    ['<b>du</b> → -st, <b>er/sie/es</b> → -t, <b>ich</b> → -e.','<b>du</b> → -st, <b>er/sie/es</b> → -t, <b>ich</b> → -e।',['du lernst','er lernt','ich lerne']],
    ['Stem change (e→i, e→ie, a→ä) happens <b>only</b> with du and er/sie/es.','স্বর-পরিবর্তন (e→i, e→ie, a→ä) <b>শুধু</b> du ও er/sie/es-এ হয়।',['du sprichst','er fährt','wir sprechen']],
    ['Age always with <b>sein</b>, never haben.','বয়স বলতে সবসময় <b>sein</b>, কখনো haben নয়।',['Ich bin zwanzig Jahre alt.']],
    ['<b>sein</b> and <b>haben</b> are irregular – learn them by heart.','<b>sein</b> ও <b>haben</b> অনিয়মিত – মুখস্থ করো।',['ich bin, du bist, er ist','ich habe, du hast, er hat']]])}</div>`);
  h+=sec('s7','7 · Groß oder klein?',L('Capital letters','বড় হাতের অক্ষর'),`<div class="card">${srows([
    ['Every <b>noun</b> starts with a capital letter.','প্রতিটি <b>বিশেষ্য</b> বড় হাতের অক্ষর দিয়ে শুরু হয়।',['der Tag','die Nacht','das Haus']],
    ['<b>Sie</b> (capital) = you (formal). <b>sie</b> (small) = she / they.','<b>Sie</b> (বড় হাতের) = আপনি। <b>sie</b> (ছোট হাতের) = সে (মেয়ে) / তারা।',['Wie heißen Sie?','Sie heißt Anna.']],
    ['In compound nouns the <b>last word</b> decides the article.','যৌগিক বিশেষ্যে <b>শেষ শব্দটি</b> আর্টিকেল ঠিক করে।',['das Wörterbuch','der Handschuh','die Telefonnummer']]])}</div>`);
  h+=sec('s9','8 · Nominativ, Akkusativ, Dativ',L('All the articles on one card','সব আর্টিকেল এক কার্ডে'),`<div class="card"><p class="en">Only three questions: <b>Wer?</b> (nominative), <b>Wen? Was?</b> (accusative), <b>Wem?</b> (dative). Masculine changes most: der → den → dem.</p><p class="bn">মাত্র তিনটি প্রশ্ন: <b>Wer?</b> (নমিনেটিভ), <b>Wen? Was?</b> (অ্যাকুজেটিভ), <b>Wem?</b> (ডেটিভ)। পুংলিঙ্গ সবচেয়ে বেশি বদলায়: der → den → dem।</p>${table({h:['','maskulin','feminin','neutral','Plural'],r:[['Nominativ','<span class=cm>der</span> / ein','<span class=cf>die</span> / eine','<span class=cn>das</span> / ein','<span class=cp>die</span> / –'],['Akkusativ','<span class=cm>den</span> / einen','<span class=cf>die</span> / eine','<span class=cn>das</span> / ein','<span class=cp>die</span> / –'],['Dativ','<span class=cm>dem</span> / einem','<span class=cf>der</span> / einer','<span class=cn>dem</span> / einem','<span class=cp>den</span> / – (+n)']]})}</div>`);
  h+=sec('s10','9 · Perfekt: haben oder sein?',L('One question decides','একটা প্রশ্নেই ঠিক হয়'),`<div class="card">${srows([
    ['Movement from A to B → <b>sein</b>.','এক জায়গা থেকে আরেক জায়গায় যাওয়া → <b>sein</b>।',['Ich bin nach Berlin gefahren.','Er ist nach Hause gegangen.']],
    ['Change of state → <b>sein</b>.','অবস্থার পরিবর্তন → <b>sein</b>।',['Ich bin um sechs Uhr aufgestanden.','Sie ist eingeschlafen.']],
    ['sein, bleiben, passieren → <b>sein</b>.','sein, bleiben, passieren → <b>sein</b>।',['Ich bin zu Hause geblieben.','Was ist passiert?']],
    ['Everything else → <b>haben</b>.','বাকি সব → <b>haben</b>।',['Ich habe Tee getrunken.','Wir haben Deutsch gelernt.']]])}</div>`);
  h+=sec('s8','10 · Lern-Geheimnisse',L('Learning secrets','শেখার গোপন কৌশল'),`<div class="card">${[
    ['Learn every noun as a package: <b>article + noun + plural</b>, with its colour.','প্রতিটি বিশেষ্য প্যাকেজ হিসেবে শেখো: <b>আর্টিকেল + শব্দ + বহুবচন</b>, রংসহ।'],
    ['<b>1 – 3 – 7</b>: review new words after 1 day, 3 days and 7 days.','<b>১ – ৩ – ৭</b>: নতুন শব্দ ১ দিন, ৩ দিন ও ৭ দিন পর আবার দেখো।'],
    ['<b>Shadowing</b>: press the speaker, pause, and repeat aloud – three times.','<b>শ্যাডোইং</b>: স্পিকারে চাপ দাও, থামো, তারপর জোরে বলো – তিনবার।'],
    ['15 minutes every day beats 2 hours once a week.','প্রতিদিন ১৫ মিনিট, সপ্তাহে একবার ২ ঘণ্টার চেয়ে ভালো।'],
    ['Make sentences about <b>your own life</b> – you remember them much better.','<b>নিজের জীবন</b> নিয়ে বাক্য বানাও – অনেক বেশি মনে থাকে।']].map(x=>`<div class="srow" style="grid-template-columns:1fr"><div><span class="en">${x[0]}</span><span class="bn" style="display:block">${x[1]}</span></div></div>`).join('')}</div>`);
  main().innerHTML=h;

const EZ={az:null,sb:null};
const EZ_END=[['ung','die'],['heit','die'],['keit','die'],['schaft','die'],['ion','die'],['tät','die'],['ik','die'],['ur','die'],['ei','die'],['chen','das'],['lein','das'],['ment','das'],['um','das'],['nis','das'],['ling','der'],['ismus','der'],['or','der']];
const ezHint=w=>{const m=/^(der|die|das)\s+(.+)$/.exec(w);if(!m)return'';const n=m[2].toLowerCase();for(const e of EZ_END){if(n.length>e[0].length+1&&n.endsWith(e[0])&&e[1]===m[1])return L(`Hint: <b>-${e[0]}</b> → ${e[1]}`,`ইঙ্গিত: <b>-${e[0]}</b> → ${e[1]}`);}return'';};
const ezShuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function azPool(){return allWords().map(x=>x.v).filter(v=>/^(der|die|das)\s/.test(v[0])&&v[1]!=='Pl.');}
function azStart(miss){
  const pool=azPool();let list;
  if(miss&&miss.length)list=ezShuffle(miss).slice(0,10);
  else list=ezShuffle(pool).slice(0,10);
  EZ.az={list:list,i:0,ok:0,miss:[],done:false,ans:''};
  azRender();
}
function azRender(){
  const box=$('#azBox');if(!box)return;const s=EZ.az;
  if(!s){box.innerHTML=`<p class="en">Pick the right article for 10 random words from the course. After every answer you see the rule that helps.</p><p class="bn">কোর্সের ১০টি এলোমেলো শব্দের সঠিক আর্টিকেল বাছো। প্রতিটি উত্তরের পর সাহায্যকারী নিয়ম দেখতে পাবে।</p><button type="button" class="btn primary" data-act="azstart">${L('Start','শুরু করো')}</button>`;return;}
  if(s.done||s.i>=s.list.length){
    const miss=s.miss;
    box.innerHTML=`<div class="fin-score"><b style="font-size:22px">${s.ok} / ${s.list.length}</b> ${s.ok>=9?'🏆':s.ok>=7?'👍':'💪'}</div>${miss.length?`<p class="en">Learn these again:</p><p class="bn">এগুলো আবার শেখো:</p><div>${miss.map(v=>`<span class="chipw">${say(wordHtml(v[0],v[1]),v[0])} <span class="en">${esc(v[2])}</span><span class="bn">${esc(v[3])}</span></span>`).join('')}</div>`:`<p class="en">Perfect! 🎉</p><p class="bn">দারুণ! 🎉</p>`}<div class="trbtns" style="margin-top:12px"><button type="button" class="btn primary" data-act="azstart">${L('New round','নতুন রাউন্ড')}</button>${miss.length?`<button type="button" class="btn" data-act="azmiss">${L('Practise my mistakes','ভুলগুলো আবার অনুশীলন')}</button>`:''}</div>`;
    return;
  }
  const v=s.list[s.i],noun=v[0].replace(/^(der|die|das)\s+/,'');
  box.innerHTML=`<div class="mute" style="font-size:13px">${s.i+1} / ${s.list.length}</div><div style="font-size:26px;font-weight:700;margin:6px 0">${s.ans?wordHtml(v[0],v[1]):'___ '+esc(noun)} ${s.ans?sayBtn(v[0]):''}</div><div class="en mute">${esc(v[2])}</div><div class="bn mute">${esc(v[3])}</div>
  <div class="opts" id="azOpts">${['der','die','das'].map(a=>`<button type="button" class="opt ${s.ans?(a===v[0].split(' ')[0]?'right':(a===s.ans?'wrong':'')):''}" data-act="azpick" data-a="${a}" ${s.ans?'disabled':''}>${a}</button>`).join('')}</div>
  ${s.ans?`<div class="fb">${s.ans===v[0].split(' ')[0]?'✅ '+L('Richtig!','ঠিক!'):'❌ '+L('Not quite – it is','হয়নি – সঠিকটি')+' <b>'+esc(v[0].split(' ')[0])+'</b>'} ${ezHint(v[0])}</div><div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="aznext">${s.i+1>=s.list.length?L('Result','ফলাফল'):L('Next','পরের')}</button></div>`:''}`;
}
function azPick(a){const s=EZ.az;if(!s||s.ans)return;const v=s.list[s.i];s.ans=a;if(a===v[0].split(' ')[0])s.ok++;else s.miss.push(v);azRender();}
function azNext(){const s=EZ.az;if(!s)return;s.i++;s.ans='';if(s.i>=s.list.length){s.done=true;store.set('azBest',Math.max(store.get('azBest',0),s.ok));}azRender();}

function sbCheck(){
  const s=EZ.sb,e=SB_LIST[s.i];if(s.ans.length!==s.tiles.length){s.res='';return;}

}

const TQ={t:null,list:[],i:0,ok:0,ans:null};
function tqBuild(t){
  const words=t.v.filter(v=>/^(der|die|das)\s/.test(v[0])),q=[];
  ezShuffle(words).slice(0,3).forEach(v=>{
    const opts=ezShuffle([v].concat(ezShuffle(words.filter(x=>x!==v)).slice(0,3)));
    q.push({k:'m',v:v,opts:opts.map(o=>o[0]),a:v[0]});
  });
  ezShuffle(words).slice(0,3).forEach(v=>q.push({k:'a',v:v,opts:['der','die','das'],a:v[0].split(' ')[0]}));
  return ezShuffle(q);
}
function tqRender(){
  const box=$('#tqBox');if(!box)return;
  if(!TQ.list.length){box.innerHTML=`<p class="en">6 quick questions made from this topic's words: meaning and article.</p><p class="bn">এই টপিকের শব্দ থেকে ৬টি প্রশ্ন: অর্থ ও আর্টিকেল।</p><button type="button" class="btn primary" data-act="tqstart">${L('Start quiz','কুইজ শুরু')}</button>`;return;}
  if(TQ.i>=TQ.list.length){box.innerHTML=`<div style="font-size:22px;font-weight:700">${TQ.ok} / ${TQ.list.length} ${TQ.ok>=5?'🏆':TQ.ok>=3?'👍':'💪'}</div><div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="tqstart">${L('Again','আবার')}</button></div>`;return;}
  const q=TQ.list[TQ.i],v=q.v,done=TQ.ans!==null;
  const title=q.k==='m'?`<span class="en">${esc(v[2])}</span> · <span class="bn">${esc(v[3])}</span>`:`___ ${esc(v[0].replace(/^(der|die|das)\s+/,''))} <span class="mute" style="font-size:14px">(${esc(v[2])})</span>`;
  box.innerHTML=`<div class="mute" style="font-size:13px">${TQ.i+1} / ${TQ.list.length} · ${q.k==='m'?L('Which German word?','কোন জার্মান শব্দ?'):L('der, die or das?','der, die নাকি das?')}</div><div style="font-size:21px;font-weight:700;margin:8px 0">${title}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt ${done?(o===q.a?'right':(i===TQ.ans?'wrong':'')):''}" data-act="tqpick" data-i="${i}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${done?`<div class="fb">${q.opts[TQ.ans]===q.a?'✅ '+L('Richtig!','ঠিক!'):'❌ '+L('Correct:','সঠিক:')+' <b>'+esc(q.a)+'</b>'} ${sayBtn(v[0])}</div><div class="trbtns" style="margin-top:10px"><button type="button" class="btn primary" data-act="tqnext">${TQ.i+1>=TQ.list.length?L('Result','ফলাফল'):L('Next','পরের')}</button></div>`:''}`;
}
function showTopics(){
  let h=`<div class="pagehead"><div class="kicker">Extras</div><h1>Themen-Training</h1><p class="en">Practise A1 by topic: words with articles, useful phrases, a short dialogue and a quiz for each theme.</p><p class="bn">বিষয় ধরে A1 অনুশীলন: আর্টিকেলসহ শব্দ, দরকারি বাক্য, ছোট সংলাপ ও প্রতিটি বিষয়ের কুইজ।</p></div><div class="topgrid">`;
  TOPICS.forEach(t=>{h+=`<a class="card topcard" href="#topic-${t.id}"><div class="topic-ic">${t.ic}</div><h3>${esc(t.de)}</h3><div class="en mute">${esc(t.en)}</div><div class="bn mute">${esc(t.bn)}</div><small class="mute">${t.v.length} ${L('words','শব্দ')} · ${t.p.length} ${L('phrases','বাক্য')} · ${L('dialogue','সংলাপ')} · ${L('quiz','কুইজ')}</small></a>`;});
  main().innerHTML=h+'</div>';
}
function showTopic(id){
  const k=TOPICS.findIndex(t=>t.id===id);if(k<0){showTopics();return;}
  const t=TOPICS[k],prev=TOPICS[(k+TOPICS.length-1)%TOPICS.length],next=TOPICS[(k+1)%TOPICS.length];
  TQ.list=[];TQ.i=0;TQ.ok=0;TQ.ans=null;TQ.t=t.id;
  let h=`<div class="pagehead"><div class="kicker"><a href="#topics">Themen-Training</a></div><h1>${t.ic} ${esc(t.de)}</h1><p class="en">${esc(t.en)}</p><p class="bn">${esc(t.bn)}</p></div>`;
  h+=sec('tw','Wortschatz',L(`Vocabulary · ${t.v.length} words`,`শব্দভান্ডার · ${bnNum(t.v.length)}টি শব্দ`),`<div class="vtools"><button class="btn" data-act="tpplay">${IC.play} ${L('Play all','সব শোনো')}</button></div>${vlist(t.v)}`);
  h+=sec('tp','Nützliche Sätze',L('Useful phrases','দরকারি বাক্য'),`<div class="card">${t.p.map(x=>`<div class="exline">${say(esc(x[0]),x[0])}<div class="en mute">${esc(x[1])}</div><div class="bn mute">${esc(x[2])}</div></div>`).join('')}</div>`);
  h+=sec('td','Dialog',L('Short dialogue','ছোট সংলাপ'),`<div class="card">${t.d.map(x=>`<div class="exline"><b>${esc(x[0])}:</b> ${say(esc(x[1]),x[1])}<div class="en mute">${esc(x[2])}</div><div class="bn mute">${esc(x[3])}</div></div>`).join('')}</div>`);
  h+=sec('tq','Quiz',L('Test yourself','নিজেকে পরীক্ষা করো'),`<div class="card"><div id="tqBox"></div></div>`);
  h+=`<div class="trbtns" style="margin:18px 0"><a class="btn" href="#topic-${prev.id}">← ${esc(prev.de)}</a><a class="btn" href="#topics">${L('All topics','সব বিষয়')}</a><a class="btn" href="#topic-${next.id}">${esc(next.de)} →</a></div>`;
  main().innerHTML=h;tqRender();
}
